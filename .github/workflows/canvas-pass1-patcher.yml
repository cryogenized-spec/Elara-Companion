name: Apply Canvas Pass 1

on:
  pull_request:
    branches:
      - main

jobs:
  patch:
    if: ${{ !contains(github.event.pull_request.title, '[canvas-pass1]') && github.head_ref == 'feat/canvas-pass1-modes' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch Canvas modes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/WorkspaceView.tsx')
          text = path.read_text()

          old = "import { AlertTriangle, ArrowLeft, Check, Clock3, Code2, Download, Eye, FileText, FileType2, History, Menu, MoreHorizontal, Plus, RefreshCw, Save, X } from 'lucide-react';"
          new = "import { AlertTriangle, ArrowLeft, Check, Clock3, Code2, Columns3, Download, Eye, FileText, FileType2, History, Menu, MoreHorizontal, Plus, RefreshCw, Save, X } from 'lucide-react';"
          assert old in text
          text = text.replace(old, new, 1)

          old = "  const [previewMode, setPreviewMode] = useState(false);"
          new = "  const [canvasMode, setCanvasMode] = useState<'raw' | 'read' | 'split'>('raw');"
          assert old in text
          text = text.replace(old, new, 1)

          text = text.replace('setPreviewMode(false);', "setCanvasMode('raw');")
          text = text.replace('setPreviewMode(true);', "setCanvasMode('read');")

          old = '''        {activeArtifact?.type === 'markdown' && <div className="flex rounded-lg border border-zinc-800 bg-zinc-900/80 p-0.5"><button onClick={() => setPreviewMode(false)} className={`flex h-8 items-center gap-1 rounded-md px-2 text-[11px] ${!previewMode ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-500'}`}><Code2 className="h-3.5 w-3.5" />Edit</button><button onClick={() => setPreviewMode(true)} className={`flex h-8 items-center gap-1 rounded-md px-2 text-[11px] ${previewMode ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-500'}`}><Eye className="h-3.5 w-3.5" />Live</button></div>}'''
          new = '''        {activeArtifact?.type === 'markdown' && <div className="flex shrink-0 rounded-lg border border-zinc-800 bg-zinc-900/80 p-0.5" role="group" aria-label="Canvas view mode"><button onClick={() => setCanvasMode('raw')} className={`flex h-8 items-center gap-1 rounded-md px-2 text-[11px] ${canvasMode === 'raw' ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-500 hover:text-zinc-300'}`} title="Raw Markdown"><Code2 className="h-3.5 w-3.5" />Raw</button><button onClick={() => setCanvasMode('read')} className={`flex h-8 items-center gap-1 rounded-md px-2 text-[11px] ${canvasMode === 'read' ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-500 hover:text-zinc-300'}`} title="Rendered reading view"><Eye className="h-3.5 w-3.5" />Read</button><button onClick={() => setCanvasMode('split')} className={`flex h-8 items-center gap-1 rounded-md px-2 text-[11px] ${canvasMode === 'split' ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-500 hover:text-zinc-300'}`} title="Source and reading view"><Columns3 className="h-3.5 w-3.5" />Split</button></div>}'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        {activeArtifact ? (previewMode && activeArtifact.type === 'markdown' ? <div className="min-h-0 h-full overflow-y-auto px-4 py-5 sm:px-8"><div className="mx-auto w-full max-w-3xl"><MarkdownRenderer content={localContent} /></div></div> : <textarea value={localContent} onChange={(e) => handleContentChange(e.target.value)} placeholder="Start writing…" className="h-full min-h-0 w-full resize-none bg-transparent px-4 py-5 font-mono text-[13px] leading-7 text-zinc-200 outline-none placeholder:text-zinc-700 sm:px-8" spellCheck={false} />) : <div className="flex h-full items-center justify-center p-6 text-center"><div className="space-y-4"><div className="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl border border-zinc-800 bg-zinc-900 text-zinc-600"><FileText className="h-7 w-7" /></div><p className="text-sm text-zinc-400">No document open.</p><button onClick={() => handleCreate('markdown')} className="rounded-xl bg-emerald-600 px-4 py-2 text-xs font-semibold text-white">Create Markdown</button></div></div>}'''
          new = '''        {activeArtifact ? (activeArtifact.type !== 'markdown' || canvasMode === 'raw' ? <textarea value={localContent} onChange={(e) => handleContentChange(e.target.value)} placeholder="Start writing…" className="h-full min-h-0 w-full resize-none bg-transparent px-4 py-5 font-mono text-[13px] leading-7 text-zinc-200 outline-none placeholder:text-zinc-700 sm:px-8" spellCheck={false} /> : canvasMode === 'read' ? <div className="min-h-0 h-full overflow-y-auto px-4 py-5 sm:px-8"><div className="mx-auto w-full max-w-3xl"><MarkdownRenderer content={localContent} /></div></div> : <div className="grid h-full min-h-0 grid-rows-2 lg:grid-cols-2 lg:grid-rows-1"><div className="min-h-0 overflow-hidden border-b border-zinc-800 lg:border-b-0 lg:border-r"><textarea value={localContent} onChange={(e) => handleContentChange(e.target.value)} placeholder="Markdown source…" className="h-full min-h-0 w-full resize-none bg-transparent px-4 py-5 font-mono text-[13px] leading-7 text-zinc-200 outline-none placeholder:text-zinc-700 sm:px-6" spellCheck={false} aria-label="Markdown source" /></div><div className="min-h-0 overflow-y-auto bg-zinc-950/20 px-4 py-5 sm:px-6"><div className="mx-auto w-full max-w-3xl"><MarkdownRenderer content={localContent} /></div></div></div>) : <div className="flex h-full items-center justify-center p-6 text-center"><div className="space-y-4"><div className="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl border border-zinc-800 bg-zinc-900 text-zinc-600"><FileText className="h-7 w-7" /></div><p className="text-sm text-zinc-400">No document open.</p><button onClick={() => handleCreate('markdown')} className="rounded-xl bg-emerald-600 px-4 py-2 text-xs font-semibold text-white">Create Markdown</button></div></div>}'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - name: Commit real source and remove patcher
        run: |
          rm -f .github/workflows/canvas-pass1-patcher.yml .canvas-pass1-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/WorkspaceView.tsx .github/workflows/canvas-pass1-patcher.yml .canvas-pass1-trigger
          git commit -m "feat: add Canvas raw read split modes [canvas-pass1]"
          git push origin HEAD:${{ github.head_ref }}
