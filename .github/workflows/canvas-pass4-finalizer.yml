name: Canvas Pass 4 Finalizer

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  finalize:
    if: github.head_ref == 'feat/canvas-pass4-live'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Apply live artifact sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/WorkspaceView.tsx')
          text = p.read_text()
          old_state = "  const [googleLinkMode, setGoogleLinkMode] = useState<'compare_only' | 'local_to_google' | 'google_to_local'>('compare_only');"
          new_state = old_state + "\n  const [artifactUpdateCue, setArtifactUpdateCue] = useState(false);"
          assert old_state in text
          text = text.replace(old_state, new_state, 1)

          marker = "  useEffect(() => () => {\n    if (debounceRef.current) clearTimeout(debounceRef.current);\n    persistCurrent('user');\n  }, [persistCurrent]);"
          addition = """

  useEffect(() => {
    const refreshFromEvent = (event: Event) => {
      const detail = (event as CustomEvent<{ artifact?: WorkspaceArtifact }>).detail;
      const targetId = detail?.artifact?.id;
      if (!targetId) return;
      const next = getWorkspace();
      const latest = next.artifacts.find((artifact) => artifact.id === targetId);
      setWorkspace(next);
      if (latest && latest.id === next.activeArtifactId) {
        contentRef.current = latest.content;
        setLocalContent(latest.content);
        setArtifactUpdateCue(true);
        window.setTimeout(() => setArtifactUpdateCue(false), 2500);
      }
    };
    window.addEventListener('elara:artifact-created', refreshFromEvent);
    window.addEventListener('storage', refreshFromEvent);
    return () => {
      window.removeEventListener('elara:artifact-created', refreshFromEvent);
      window.removeEventListener('storage', refreshFromEvent);
    };
  }, []);
"""
          assert marker in text
          text = text.replace(marker, marker + addition, 1)

          cue = "          {status && <div className=\"truncate text-[10px] text-zinc-500\">{status}</div>}"
          cue2 = cue + "{artifactUpdateCue && <div className=\"mt-0.5 text-[10px] text-emerald-400\">Updated by Elara</div>}"
          assert cue in text
          text = text.replace(cue, cue2, 1)
          p.write_text(text)
          PY

      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - name: Commit and clean temporary workflows
        run: |
          rm -f .github/workflows/canvas-pass4-patcher.yml .github/workflows/canvas-pass4-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/WorkspaceView.tsx .github/workflows/canvas-pass4-patcher.yml .github/workflows/canvas-pass4-finalizer.yml
          git commit -m "feat: synchronize Canvas with autonomous artifact updates [canvas-pass4]"
          git push
