name: Apply Canvas Pass 4

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  patch:
    if: github.head_ref == 'feat/canvas-pass4-live'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Patch live artifact sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/WorkspaceView.tsx')
          text = p.read_text()

          old_state = "  const [googleLinkMode, setGoogleLinkMode] = useState<'compare_only' | 'local_to_google' | 'google_to_local'>('compare_only');"
          new_state = old_state + "\n  const [artifactUpdateCue, setArtifactUpdateCue] = useState(false);"
          assert old_state in text
          text = text.replace(old_state, new_state, 1)

          marker = "  useEffect(() => () => {\n    if (debounceRef.current) clearTimeout(debounceRef.current);\n    persistCurrent('user');\n  }, [persistCurrent]);"
          addition = """

  useEffect(() => {
    const refreshFromEvent = (event: Event) => {
      const detail = (event as CustomEvent<{ artifact?: WorkspaceArtifact; action?: string }>).detail;
      const targetId = detail?.artifact?.id;
      if (!targetId) return;
      const next = getWorkspace();
      setWorkspace(next);
      const latest = next.artifacts.find((artifact) => artifact.id === targetId);
      if (!latest || latest.id !== next.activeArtifactId) return;
      contentRef.current = latest.content;
      setLocalContent(latest.content);
      setArtifactUpdateCue(true);
      window.setTimeout(() => setArtifactUpdateCue(false), 2500);
    };
    window.addEventListener('elara:artifact-created', refreshFromEvent);
    window.addEventListener('storage', refreshFromEvent);
    return () => {
      window.removeEventListener('elara:artifact-created', refreshFromEvent);
      window.removeEventListener('storage', refreshFromEvent);
    };
  }, []);
"""
          assert marker in text
          text = text.replace(marker, marker + addition, 1)

          marker2 = "          {status && <div className=\"truncate text-[10px] text-zinc-500\">{status}</div>}"
          replacement2 = marker2 + "{artifactUpdateCue && <div className=\"mt-0.5 text-[10px] text-emerald-400\">Updated by Elara</div>}"
          assert marker2 in text
          text = text.replace(marker2, replacement2, 1)

          p.write_text(text)
          PY

      - name: Validate and commit
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build
          rm -f .github/workflows/canvas-pass4-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/WorkspaceView.tsx .github/workflows/canvas-pass4-patcher.yml
          git commit -m "feat: keep Canvas synchronized with autonomous artifact updates [canvas-pass4]"
          git push
