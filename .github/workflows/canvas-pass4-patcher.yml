name: Apply Canvas Pass 4

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  patch:
    if: github.head_ref == 'feat/canvas-pass4-live'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Patch Canvas integration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/WorkspaceView.tsx')
          text = p.read_text()

          old_import = "import { AlertTriangle, ArrowLeft, Check, Clock3, Code2, Columns3, Download, Eye, FileText, FileType2, History, Menu, MoreHorizontal, Plus, RefreshCw, Save, X } from 'lucide-react';"
          new_import = "import { AlertTriangle, ArrowLeft, Check, Clock3, Code2, Columns3, Download, Eye, FileText, FileType2, History, ListTree, Menu, MoreHorizontal, Plus, RefreshCw, Save, Search, X } from 'lucide-react';"
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old_state = "  const [googleLinkMode, setGoogleLinkMode] = useState<'compare_only' | 'local_to_google' | 'google_to_local'>('compare_only');"
          new_state = old_state + "\n  const [outlineOpen, setOutlineOpen] = useState(false);\n  const [findOpen, setFindOpen] = useState(false);\n  const [findQuery, setFindQuery] = useState('');\n  const textareaRef = useRef<HTMLTextAreaElement | null>(null);"
          assert old_state in text
          text = text.replace(old_state, new_state, 1)

          marker = "  useEffect(() => () => {\n    if (debounceRef.current) clearTimeout(debounceRef.current);\n    persistCurrent('user');\n  }, [persistCurrent]);"
          addition = '''

  useEffect(() => {
    const refreshFromEvent = (event: Event) => {
      const detail = (event as CustomEvent<{ artifact?: WorkspaceArtifact; action?: string }>).detail;
      const next = getWorkspace();
      setWorkspace(next);
      const targetId = detail?.artifact?.id;
      const latest = targetId ? next.artifacts.find((artifact) => artifact.id === targetId) : null;
      if (latest && latest.id === next.activeArtifactId) {
        contentRef.current = latest.content;
        setLocalContent(latest.content);
      }
    };
    window.addEventListener('elara:artifact-created', refreshFromEvent);
    window.addEventListener('storage', refreshFromEvent);
    return () => {
      window.removeEventListener('elara:artifact-created', refreshFromEvent);
      window.removeEventListener('storage', refreshFromEvent);
    };
  }, []);

  const headings = useMemo(() => {
    return localContent.split('\\n').flatMap((line, index) => {
      const match = /^(#{1,4})\\s+(.+?)\\s*$/.exec(line);
      if (!match) return [];
      return [{ level: match[1].length, text: match[2].replace(/[*_`]/g, ''), line: index }];
    });
  }, [localContent]);

  const findCount = useMemo(() => {
    const needle = findQuery.trim().toLowerCase();
    if (!needle) return 0;
    return localContent.toLowerCase().split(needle).length - 1;
  }, [findQuery, localContent]);

  const focusFindMatch = (direction: 1 | -1) => {
    const query = findQuery.trim();
    const textarea = textareaRef.current;
    if (!query || !textarea) return;
    const source = textarea.value.toLowerCase();
    const needle = query.toLowerCase();
    const start = direction > 0 ? textarea.selectionEnd : Math.max(0, textarea.selectionStart - 1);
    const index = direction > 0 ? source.indexOf(needle, start) : source.lastIndexOf(needle, start);
    const target = index >= 0 ? index : (direction > 0 ? source.indexOf(needle) : source.lastIndexOf(needle));
    if (target >= 0) {
      setCanvasMode('raw');
      requestAnimationFrame(() => {
        textarea.focus();
        textarea.setSelectionRange(target, target + needle.length);
      });
    }
  };
'''
          assert marker in text
          text = text.replace(marker, marker + addition, 1)

          text = text.replace('<textarea value={localContent} onChange={(e) => handleContentChange(e.target.value)} placeholder="Start writing…"', '<textarea ref={textareaRef} value={localContent} onChange={(e) => handleContentChange(e.target.value)} placeholder="Start writing…"', 1)
          text = text.replace('<textarea value={localContent} onChange={(e) => handleContentChange(e.target.value)} placeholder="Markdown source…"', '<textarea ref={textareaRef} value={localContent} onChange={(e) => handleContentChange(e.target.value)} placeholder="Markdown source…"', 1)

          more_marker = '<button onClick={() => setDrawerOpen(true)} className="flex h-9 w-9 items-center justify-center rounded-lg text-zinc-400 hover:bg-zinc-800 hover:text-zinc-100" title="More"><MoreHorizontal className="h-4 w-4" /></button>'
          more_replacement = more_marker + '<button onClick={() => setOutlineOpen(true)} className="hidden sm:flex h-9 w-9 items-center justify-center rounded-lg text-zinc-400 hover:bg-zinc-800 hover:text-zinc-100" title="Document outline"><ListTree className="h-4 w-4" /></button><button onClick={() => setFindOpen(true)} className="hidden sm:flex h-9 w-9 items-center justify-center rounded-lg text-zinc-400 hover:bg-zinc-800 hover:text-zinc-100" title="Find in document"><Search className="h-4 w-4" /></button>'
          assert more_marker in text
          text = text.replace(more_marker, more_replacement, 1)

          history_marker = '<button onClick={() => setHistoryOpen(true)} className="inline-flex shrink-0 items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-[11px] text-zinc-400 hover:bg-zinc-800"><History className="h-3.5 w-3.5" />History</button>'
          history_replacement = history_marker + '<button onClick={() => setOutlineOpen(true)} className="inline-flex shrink-0 items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-[11px] text-zinc-400 hover:bg-zinc-800"><ListTree className="h-3.5 w-3.5" />Outline</button><button onClick={() => setFindOpen(true)} className="inline-flex shrink-0 items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-[11px] text-zinc-400 hover:bg-zinc-800"><Search className="h-3.5 w-3.5" />Find</button>'
          assert history_marker in text
          text = text.replace(history_marker, history_replacement, 1)

          insert_before = '      {historyOpen && activeArtifact &&'
          panels = '''      {outlineOpen && <div className="fixed inset-0 z-[55] bg-black/60 backdrop-blur-sm" onClick={() => setOutlineOpen(false)}><section className="absolute inset-x-3 bottom-3 max-h-[75dvh] overflow-hidden rounded-2xl border border-zinc-800 bg-[#111113] shadow-2xl" onClick={(e) => e.stopPropagation()}><div className="flex items-center justify-between border-b border-zinc-800 px-4 py-3"><div><div className="text-sm font-semibold">Document outline</div><div className="text-[10px] text-zinc-500">{headings.length} headings</div></div><button onClick={() => setOutlineOpen(false)} className="rounded-lg p-1.5 text-zinc-500"><X className="h-4 w-4" /></button></div><div className="max-h-[60dvh] overflow-y-auto p-3">{headings.length === 0 ? <div className="p-4 text-xs text-zinc-600">No Markdown headings found.</div> : headings.map((heading, index) => <button key={`${heading.line}-${index}`} onClick={() => { setOutlineOpen(false); setFindQuery(heading.text); setFindOpen(true); }} className="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-xs text-zinc-300 hover:bg-zinc-900"><span className="w-5 shrink-0 text-[10px] text-zinc-600">H{heading.level}</span><span className="truncate" style={{ paddingLeft: `${Math.max(0, heading.level - 1) * 10}px` }}>{heading.text}</span></button>)}</div></section></div>}

      {findOpen && <div className="fixed inset-0 z-[55] bg-black/60 backdrop-blur-sm" onClick={() => setFindOpen(false)}><section className="absolute inset-x-3 top-16 rounded-2xl border border-zinc-800 bg-[#111113] p-4 shadow-2xl" onClick={(e) => e.stopPropagation()}><div className="mb-3 flex items-center justify-between"><div><div className="text-sm font-semibold">Find in document</div><div className="text-[10px] text-zinc-500">{findCount} match{findCount === 1 ? '' : 'es'}</div></div><button onClick={() => setFindOpen(false)} className="rounded-lg p-1.5 text-zinc-500"><X className="h-4 w-4" /></button></div><input autoFocus value={findQuery} onChange={(e) => setFindQuery(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') focusFindMatch(e.shiftKey ? -1 : 1); }} placeholder="Search this artifact…" className="w-full rounded-xl border border-zinc-800 bg-zinc-950 px-3 py-2.5 text-xs outline-none focus:border-sky-500/50" /><div className="mt-3 flex gap-2"><button onClick={() => focusFindMatch(-1)} disabled={!findQuery.trim()} className="flex-1 rounded-xl border border-zinc-800 px-3 py-2 text-xs text-zinc-300 disabled:opacity-40">Previous</button><button onClick={() => focusFindMatch(1)} disabled={!findQuery.trim()} className="flex-1 rounded-xl bg-zinc-100 px-3 py-2 text-xs font-semibold text-zinc-900 disabled:opacity-40">Next</button></div></section></div>}

'''
          assert insert_before in text
          text = text.replace(insert_before, panels + insert_before, 1)

          p.write_text(text)
          PY

      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - name: Commit source and remove patcher
        run: |
          rm -f .github/workflows/canvas-pass4-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/WorkspaceView.tsx .github/workflows/canvas-pass4-patcher.yml
          git commit -m "feat: make Canvas live with artifact updates and navigation [canvas-pass4]"
          git push
