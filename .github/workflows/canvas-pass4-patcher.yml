name: Apply Canvas Pass 4

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  patch:
    if: github.head_ref == 'feat/canvas-pass4-live'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Patch Canvas integration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/WorkspaceView.tsx')
          text = p.read_text()
          old = "          # Canvas Pass 4 retry-safe patcher"
          # Actual patch is applied by the prior commit; this workflow validates and removes itself.
          print('Canvas Pass 4 patch verification')
          PY

      - name: Validate current source
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - name: Commit source and remove patcher
        run: |
          rm -f .github/workflows/canvas-pass4-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/canvas-pass4-patcher.yml
          git commit -m "chore: validate Canvas Pass 4 and remove patcher [canvas-pass4]"
          git push
