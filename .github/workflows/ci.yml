name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/**, refactor/**]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Mount canonical Voice settings panel for Pass 3
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'refactor/voice-pass3-ui-final' }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/SettingsModal.tsx')
          text = path.read_text()
          import_anchor = "import { loadRateLimits } from '../lib/storage';\n"
          import_line = "import { VoiceSettingsPanel } from './VoiceSettingsPanel';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('SettingsModal import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          start_marker = "          {/* TAB: VOICE & SPEECH-TO-TEXT */}"
          end_marker = "          {/* TAB 3: SYSTEM PROMPT & MODULES */}"
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit(f'Voice tab markers not found: start={start}, end={end}')

          replacement = '''          {/* TAB: VOICE & SPEECH-TO-TEXT */}
          {activeTab === 'voice' && (
            <VoiceSettingsPanel
              value={formData.voiceSettings}
              onChange={(voiceSettings) =>
                setFormData({
                  ...formData,
                  voiceSettings,
                  speechLanguage: voiceSettings.language,
                  speechAutoSend: voiceSettings.autoSendOnSilence,
                  speechAutoCapitalize: voiceSettings.autoCapitalize,
                  speechPauseTimeout: voiceSettings.silenceTimeoutMs,
                })
              }
            />
          )}

'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SettingsModal.tsx src/components/VoiceSettingsPanel.tsx
          if git diff --cached --quiet; then
            echo "Voice settings panel already mounted."
          else
            git commit -m "feat: mount canonical voice settings panel"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
