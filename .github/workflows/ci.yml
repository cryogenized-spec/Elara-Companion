name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/**, refactor/**]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: One-shot Settings boundary migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/pass64-google-facade-inversion' && !contains(github.event.head_commit.message, 'complete application boundary extraction')
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('src/components/SettingsModal.tsx')
          source = settings.read_text()

          replacements = [
              ("import { getDbSnapshots, setDbSnapshots } from '../lib/db';", "import { settingsPersistence } from '../services/settingsPersistenceService';"),
              ("import { loadRateLimits } from '../lib/storage';", "import { getSettingsRateLimits } from '../services/settingsDiagnosticsService';"),
              ("import { googleCalendarContract } from '../contracts/implementations';", "import { getUpcomingCalendarEvents } from '../services/settingsCalendarService';"),
              ('    getDbSnapshots().then(setSnapshots);', '    settingsPersistence.loadPersonaSnapshots().then(setSnapshots);'),
              ('    await setDbSnapshots(updated);', '    await settingsPersistence.savePersonaSnapshots(updated);'),
              ('      const data = await googleCalendarContract.getUpcoming(15);', '      const data = await getUpcomingCalendarEvents(15);'),
              ('      const events = await googleCalendarContract.getUpcoming(5);', '      const events = await getUpcomingCalendarEvents(5);'),
              ('      setRateLimits(loadRateLimits());', '      setRateLimits(getSettingsRateLimits());'),
          ]

          for old, new in replacements:
              source = source.replace(old, new)

          for name in ['searchKeepNotes','createKeepNote','updateKeepNote','getKeepNote','deleteKeepNote','listKeepNotes','KeepNoteItem']:
              source = source.replace(f'  {name},\n', '')

          marker = "} from '../services/settingsGoogleService';\n"
          if "from '../services/referenceArchiveService';" not in source:
              archive = """} from '../services/settingsGoogleService';
import {
  searchReferenceNotes as searchKeepNotes,
  createReferenceNote as createKeepNote,
  updateReferenceNote as updateKeepNote,
  getReferenceNote as getKeepNote,
  deleteReferenceNote as deleteKeepNote,
  listReferenceNotes as listKeepNotes,
} from '../services/referenceArchiveService';
import type { ReferenceNoteItem as KeepNoteItem } from '../services/referenceArchiveService';
"""
              if marker not in source:
                  raise SystemExit('settingsGoogleService import marker not found')
              source = source.replace(marker, archive, 1)

          forbidden = ['getDbSnapshots','setDbSnapshots','googleCalendarContract','loadRateLimits']
          for name in forbidden:
              if name in source:
                  raise SystemExit(f'Unmigrated Settings dependency remains: {name}')

          settings.write_text(source)

          lock = Path('src/architecture/architectural-lock.test.ts')
          lock_source = lock.read_text()
          old = "  assert.doesNotMatch(source, /searchKeepNotes|createKeepNote|updateKeepNote|getKeepNote|deleteKeepNote|listKeepNotes/);"
          new = """  const googleImport = source.match(/import \\{[\\s\\S]*?\\} from ['\"]\\.\\.\\/services\\/settingsGoogleService['\"]/)\n  assert.ok(googleImport, 'SettingsModal must import settingsGoogleService through the canonical boundary');\n  assert.doesNotMatch(googleImport[0], /searchKeepNotes|createKeepNote|updateKeepNote|getKeepNote|deleteKeepNote|listKeepNotes/);"""
          if old in lock_source:
              lock.write_text(lock_source.replace(old, new, 1))
          PY

          npm install --no-audit --no-fund
          npm run verify:production
          npm test
          git diff --check

          git config user.name 'Elara Architecture Bot'
          git config user.email 'architecture@users.noreply.github.com'
          git add src/components/SettingsModal.tsx src/architecture/architectural-lock.test.ts
          git diff --cached --check
          git commit -m 'refactor(settings): complete application boundary extraction'

          cat > .github/workflows/ci.yml <<'EOF'
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/**, refactor/**]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production verification
        run: npm run verify:production
EOF
          git add .github/workflows/ci.yml
          git diff --cached --check
          git commit --amend --no-edit
          git push --force-with-lease

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production verification
        run: npm run verify:production
