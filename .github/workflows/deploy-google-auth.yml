name: Deploy Elara Google Auth Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Configure Google auth worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('background-runtime/wrangler.google-auth.toml')
          text = p.read_text()
          text = text.replace('REPLACE_WITH_KV_NAMESPACE_ID', '${{ secrets.GOOGLE_VAULT_KV_NAMESPACE_ID }}')
          p.write_text(text)
          PY

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config background-runtime/wrangler.google-auth.toml
