name: Fix Pass 4 App corruption

on:
  push:
    branches: [fix/pass4-residual-app-corruption]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pass4-residual-app-corruption
          token: ${{ secrets.ELARA_MIRROR_TOKEN }}
          fetch-depth: 0
      - name: Repair App.tsx
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          text = p.read_text()
          start_marker = '  // Stop Streaming\n'
          end_marker = '  // Send Message\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('corrupted Pass 4 region not found')
          replacement = '''  // Stop Streaming\n  const handleStopStreaming = () => {\n    if (abortControllerRef.current) {\n      abortControllerRef.current.abort();\n      abortControllerRef.current = null;\n    }\n    setIsStreaming(false);\n\n    if (activeId) {\n      setConversations((prev) =>\n        prev.map((c) => {\n          if (c.id !== activeId) return c;\n          const updatedMsgs = c.messages.map((m) =>\n            m.isStreaming ? { ...m, isStreaming: false } : m\n          );\n          return { ...c, messages: updatedMsgs };\n        })\n      );\n    }\n  };\n\n  const {\n    streamAssistantResponse,\n    generateConversationTitle,\n  } = useChatStreamController({\n    conversations,\n    settings,\n    memoryState,\n    setConversations,\n    setMemoryState,\n    setIsStreaming,\n    abortControllerRef,\n    userHasScrolledUpRef,\n  });\n\n'''
          p.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Verify
        run: |
          set -euo pipefail
          grep -q "return { ...c, messages: updatedMsgs };" src/App.tsx
          grep -q "const {" src/App.tsx
          grep -q "streamAssistantResponse" src/App.tsx
          ! grep -q "h (e)" src/App.tsx
      - name: Typecheck baseline only
        continue-on-error: true
        run: npm exec tsc -- --noEmit
      - name: Commit repair
        env:
          TOKEN: ${{ secrets.ELARA_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Elara Architecture Bot'
          git config user.email 'elara-architecture@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'fix: repair residual App pass4 extraction corruption'
          git push https://x-access-token:${TOKEN}@github.com/cryogenized-spec/Elara-Companion.git HEAD:fix/pass4-residual-app-corruption
