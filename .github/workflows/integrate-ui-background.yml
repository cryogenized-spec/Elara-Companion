name: Integrate UI + background runtime

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.head.ref, 'integrated')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Apply source integration
        run: node scripts/integrate-ui-background.mjs

      - name: Validate package resolution
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit integrated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SettingsModal.tsx src/components/WorkspaceView.tsx src/components/Sidebar.tsx src/App.tsx
          git diff --cached --quiet || git commit -m 'feat: integrate artifacts and background-safe chat'
          git push origin HEAD:${{ github.head_ref }}

      - name: Remove integration workflow and patcher
        run: |
          git rm .github/workflows/integrate-ui-background.yml scripts/integrate-ui-background.mjs
          git commit -m 'chore: remove integration patcher'
          git push origin HEAD:${{ github.head_ref }}
