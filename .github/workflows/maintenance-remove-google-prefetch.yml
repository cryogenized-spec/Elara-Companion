name: Maintenance - remove legacy Google prefetch

on:
  push:
    branches: [refactor/remove-google-prefetch]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove legacy Google prefetch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()

          old_import = '''import { \n  isGoogleConnected,
  getAccessToken,
  getTasks, 
  getUpcomingCalendarEvents, 
  listGmailMessages, 
  searchContacts, 
  searchKeepNotes,
  createKeepNote,
  updateKeepNote,
  getKeepNote,
  createGoogleDoc,
  editGoogleDoc,
  getGoogleDoc,
  searchGoogleDriveDocs
} from './lib/googleApi';'''

          new_import = "import { getAccessToken } from './lib/googleApi';"
          if old_import not in text:
              raise SystemExit('Expected legacy googleApi import block was not found')
          text = text.replace(old_import, new_import, 1)

          marker_start = '    // Background Google Workspace Autonomous Sync Detection'
          marker_end = '    const formattedSystemPrompt = buildSystemPayload({'
          start = text.find(marker_start)
          end = text.find(marker_end, start)
          if start < 0 or end < 0:
              raise SystemExit('Expected legacy Google prefetch block was not found')

          text = text[:start] + text[end:]
          text = text.replace('      baseSystemInstruction: effectiveBaseSystemInstruction,', '      baseSystemInstruction,', 1)
          path.write_text(text)
          PY

      - name: Verify legacy prefetch is gone
        run: |
          ! grep -n "Background Google Workspace Autonomous Sync Detection" src/App.tsx
          ! grep -n "AUTONOMOUS BACKGROUND TOOL SYNC" src/App.tsx

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit and remove maintenance workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/maintenance-remove-google-prefetch.yml
          git add src/App.tsx .github/workflows/maintenance-remove-google-prefetch.yml
          git commit -m "refactor: remove legacy Google background prefetch"
          git push
