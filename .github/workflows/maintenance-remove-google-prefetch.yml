name: Maintenance - remove legacy Google prefetch

on:
  push:
    branches: [refactor/google-runtime-canonicalization]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove legacy Google prefetch from App.tsx
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old_import = '''import { \n  isGoogleConnected,
  getAccessToken,
  getTasks, 
  getUpcomingCalendarEvents, 
  listGmailMessages, 
  searchContacts, 
  searchKeepNotes,
  createKeepNote,
  updateKeepNote,
  getKeepNote,
  createGoogleDoc,
  editGoogleDoc,
  getGoogleDoc,
  searchGoogleDriveDocs
} from './lib/googleApi';'''
          if old_import not in text:
              raise SystemExit('Expected legacy googleApi import block was not found')
          text = text.replace(old_import, "import { getAccessToken } from './lib/googleApi';", 1)
          start = text.index('    // Background Google Workspace Autonomous Sync Detection')
          end_marker = '    const formattedSystemPrompt = buildSystemPayload({'
          end = text.index(end_marker, start)
          text = text[:start] + end_marker + text[end + len(end_marker):]
          text = text.replace('      baseSystemInstruction: effectiveBaseSystemInstruction,', '      baseSystemInstruction,', 1)
          path.write_text(text)
          PY
      - name: Test and typecheck
        run: |
          npm ci
          npm test
          npm run lint
      - name: Commit cleaned runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/maintenance-remove-google-prefetch.yml
          git add src/App.tsx .github/workflows/maintenance-remove-google-prefetch.yml
          git commit -m "refactor: remove legacy Google background prefetch"
          git push
