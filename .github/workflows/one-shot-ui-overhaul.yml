name: One-shot UI overhaul patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: apply UI overhaul') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Apply UI patch
        run: node scripts/patch-ui-overhaul.mjs

      - name: Commit UI changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SettingsModal.tsx src/components/WorkspaceView.tsx src/components/Sidebar.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'chore: apply UI overhaul'
          git push

      - name: Remove one-shot patcher
        run: |
          git rm .github/workflows/one-shot-ui-overhaul.yml scripts/patch-ui-overhaul.mjs
          git commit -m 'chore: remove one-shot UI patcher'
          git push
