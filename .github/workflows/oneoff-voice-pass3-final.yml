name: One-off Voice Pass 3 Finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor == 'cryogenized-spec' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pass 3 branch
        uses: actions/checkout@v6
        with:
          ref: refactor/voice-pass3-ui-final
          fetch-depth: 0
          persist-credentials: true

      - name: Integrate canonical Voice panel
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/SettingsModal.tsx')
          text = path.read_text()

          import_anchor = "import { loadRateLimits } from '../lib/storage';\n"
          import_line = "import { VoiceSettingsPanel } from './VoiceSettingsPanel';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('SettingsModal import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          start_marker = "          {/* TAB: VOICE & SPEECH-TO-TEXT */}"
          end_marker = "          {/* TAB 3: SYSTEM PROMPT & MODULES */}"
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit(f'Voice tab markers not found: start={start}, end={end}')

          replacement = '''          {/* TAB: VOICE & SPEECH-TO-TEXT */}
          {activeTab === 'voice' && (
            <VoiceSettingsPanel
              value={formData.voiceSettings}
              onChange={(voiceSettings) =>
                setFormData({
                  ...formData,
                  voiceSettings,
                  speechLanguage: voiceSettings.language,
                  speechAutoSend: voiceSettings.autoSendOnSilence,
                  speechAutoCapitalize: voiceSettings.autoCapitalize,
                  speechPauseTimeout: voiceSettings.silenceTimeoutMs,
                })
              }
            />
          )}

'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Commit Pass 3 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SettingsModal.tsx src/components/VoiceSettingsPanel.tsx
          git commit -m "feat: mount canonical voice settings panel"
          git push origin HEAD:refactor/voice-pass3-ui-final

      - name: Remove temporary workflow from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/oneoff-voice-pass3-final.yml
          git commit -m "chore: remove one-off voice finalization workflow"
          git push origin main
