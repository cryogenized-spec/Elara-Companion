name: One-off Voice Pass 3 Apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply canonical Voice UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/SettingsModal.tsx')
          text = path.read_text()

          import_anchor = "import { loadRateLimits } from '../lib/storage';\n"
          import_line = "import { VoiceSettingsPanel } from './VoiceSettingsPanel';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('SettingsModal import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          start_marker = "          {/* TAB: VOICE & SPEECH-TO-TEXT */}"
          end_marker = "          {/* TAB 3: SYSTEM PROMPT & MODULES */}"
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit(f'Voice tab markers not found: start={start}, end={end}')

          replacement = '''          {/* TAB: VOICE & SPEECH-TO-TEXT */}
          {activeTab === 'voice' && (
            <VoiceSettingsPanel
              value={formData.voiceSettings}
              onChange={(voiceSettings) =>
                setFormData({
                  ...formData,
                  voiceSettings,
                  speechLanguage: voiceSettings.language,
                  speechAutoSend: voiceSettings.autoSendOnSilence,
                  speechAutoCapitalize: voiceSettings.autoCapitalize,
                  speechPauseTimeout: voiceSettings.silenceTimeoutMs,
                })
              }
            />
          )}

'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Lint/typecheck gate
        run: |
          npm install --no-audit --no-fund
          npm run lint

      - name: Commit integrated source and remove workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SettingsModal.tsx src/components/VoiceSettingsPanel.tsx
          git commit -m "feat: replace legacy voice settings UI"
          git rm .github/workflows/oneoff-voice-pass3.yml
          git commit -m "chore: remove one-off voice pass workflow"
          git push origin "HEAD:${HEAD_BRANCH}"
