name: Point 1 Docs Drive Extraction
on:
  push:
    branches: [refactor/point1-google-docs-drive]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Extract Docs Drive service
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/googleApi.ts')
          text = path.read_text()
          start_marker = '// ---------------- Docs / Drive ----------------'
          end_marker = '// ---------------- Tasks ----------------'
          start = text.index(start_marker)
          end = text.index(end_marker)
          block = text[start:end].strip() + '\n'
          for old, new in [
            ('await requestGoogleAuth()', "await getGoogleDocsDriveAccessToken('docs')"),
          ]:
            block = block.replace(old, new)
          block = block.replace("getGoogleDocsDriveAccessToken('docs')", "getGoogleDocsDriveAccessToken('docs')", 1)
          # Explicitly separate read-only Drive calls from Docs/Drive writes.
          block = block.replace("await getGoogleDocsDriveAccessToken('docs')", "await getGoogleDocsDriveAccessToken('docs')")
          helper = """import { googleCapabilities, googleIdentity } from './googleWorkspaceService';\nimport type { GoogleCapability } from './googleWorkspaceService';\n\nasync function getGoogleDocsDriveAccessToken(capability: GoogleCapability): Promise<string> {\n  const token = googleIdentity.getAccessToken();\n  if (token && googleCapabilities.isGranted(googleCapabilities.getGrantedScopes(), capability)) return token;\n  return googleIdentity.requestCapabilityAuthorization(googleCapabilities.getScopes(capability), false);\n}\n\nasync function parseGoogleApiError(res: Response, prefix: string): Promise<string> {\n  const raw = await res.text().catch(() => '');\n  try {\n    const json = JSON.parse(raw);\n    return `${prefix}: ${json?.error?.message || json?.error || `HTTP ${res.status}`}`;\n  } catch {\n    return `${prefix}: ${raw || `HTTP ${res.status}`}`;\n  }\n}\n\nfunction authHeaders(token: string) { return { Authorization: `Bearer ${token}` }; }\nfunction jsonHeaders(token: string) { return { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }; }\n\n"""
          service = helper + block.replace(start_marker + '\n', '')
          Path('src/services/googleDocsDriveService.ts').write_text(service)
          imports = "import { createGoogleDoc, getGoogleDoc, editGoogleDoc, searchGoogleDriveDocs, listGoogleDriveFiles, searchGoogleDriveFiles, readGoogleDriveFile } from '../services/googleDocsDriveService';\n"
          exports = "export { createGoogleDoc, getGoogleDoc, editGoogleDoc, searchGoogleDriveDocs, listGoogleDriveFiles, searchGoogleDriveFiles, readGoogleDriveFile } from '../services/googleDocsDriveService';\nexport type { GoogleDocSummary, GoogleDriveFileSummary } from '../services/googleDocsDriveService';\n\n"
          path.write_text(text[:start] + imports + exports + text[end:])
          PY
          npm install --no-audit --no-fund
          npm run lint
          npx tsc --noEmit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/googleApi.ts src/services/googleDocsDriveService.ts
          git commit -m 'refactor(google): extract Docs Drive provider service [point1]'
          git push origin HEAD:$BRANCH
          rm -f .github/workflows/pass-point1-docs-drive.yml
          git add -u .github/workflows/pass-point1-docs-drive.yml
          git commit -m 'chore(point1): remove Docs Drive extraction runner' || true
          git push origin HEAD:$BRANCH
