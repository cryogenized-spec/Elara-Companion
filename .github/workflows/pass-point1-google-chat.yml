name: Point 1 Google Chat Extraction
on:
  push:
    branches: [refactor/point1-google-docs-drive]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Extract Google Chat provider
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/googleApi.ts')
          text = path.read_text()
          start_marker = '// ---------------- Google Chat ----------------'
          end_marker = '// Legacy compatibility exports.'
          start = text.index(start_marker)
          end = text.index(end_marker)
          block = text[start:end].strip() + '\n'
          helper = """import { googleCapabilities, googleIdentity } from './googleWorkspaceService';\nimport type { GoogleCapability } from './googleWorkspaceService';\n\nasync function getGoogleChatAccessToken(capability: GoogleCapability): Promise<string> {\n  const token = googleIdentity.getAccessToken();\n  if (token && googleCapabilities.isGranted(googleCapabilities.getGrantedScopes(), capability)) return token;\n  return googleIdentity.requestCapabilityAuthorization(googleCapabilities.getScopes(capability), false);\n}\n\nasync function parseGoogleApiError(res: Response, prefix: string): Promise<string> {\n  const raw = await res.text().catch(() => '');\n  try {\n    const json = JSON.parse(raw);\n    return `${prefix}: ${json?.error?.message || json?.error || `HTTP ${res.status}`}`;\n  } catch {\n    return `${prefix}: ${raw || `HTTP ${res.status}`}`;\n  }\n}\n\nfunction authHeaders(token: string) { return { Authorization: `Bearer ${token}` }; }\nfunction jsonHeaders(token: string) { return { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }; }\n\n"""
          replacements = [
            ('listChatSpaces', 'chat.read'),
            ('createChatSpace', 'chat.manage'),
            ('listChatMessages', 'chat.read'),
            ('sendChatMessage', 'chat.send'),
            ('sendChatCardMessage', 'chat.send'),
          ]
          for fn, cap in replacements:
            marker = f'export async function {fn}'
            pos = block.index(marker)
            next_pos = block.find('\nexport async function ', pos + len(marker))
            if next_pos == -1:
              next_pos = block.find('\nconst LOCAL_WEBHOOKS_KEY', pos + len(marker))
            if next_pos == -1:
              next_pos = len(block)
            chunk = block[pos:next_pos]
            chunk = chunk.replace('await requestGoogleAuth()', f"await getGoogleChatAccessToken('{cap}')")
            block = block[:pos] + chunk + block[next_pos:]
          service = helper + block.replace(start_marker + '\n', '')
          Path('src/services/googleChatService.ts').write_text(service)
          facade_imports = """import { listChatSpaces, createChatSpace, listChatMessages, sendChatMessage, sendChatCardMessage, postChatWebhook, loadSpaceWebhooks, saveSpaceWebhooks, buildTaskApprovalCard, buildDraftPreviewCard, buildScheduleSweepCard, buildSystemAlertCard } from '../services/googleChatService';\nexport { listChatSpaces, createChatSpace, listChatMessages, sendChatMessage, sendChatCardMessage, postChatWebhook, loadSpaceWebhooks, saveSpaceWebhooks, buildTaskApprovalCard, buildDraftPreviewCard, buildScheduleSweepCard, buildSystemAlertCard } from '../services/googleChatService';\nexport type { ChatSpaceMember, ChatSpace, ChatMessageResult, SpaceWebhookConfig } from '../services/googleChatService';\n\n"""
          path.write_text(text[:start] + facade_imports + text[end:])
          PY
          npm install --no-audit --no-fund
          npm run lint
          npx tsc --noEmit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/googleApi.ts src/services/googleChatService.ts
          git commit -m 'refactor(google): extract Google Chat provider service [point1]'
          git push origin HEAD:$BRANCH
          rm -f .github/workflows/pass-point1-google-chat.yml docs/POINT1_CHAT_TRIGGER.md docs/POINT1_CHAT_TRIGGER_2.md
          git add -u .github/workflows/pass-point1-google-chat.yml docs/POINT1_CHAT_TRIGGER.md docs/POINT1_CHAT_TRIGGER_2.md
          git commit -m 'chore(point1): remove temporary Google Chat runner' || true
          git push origin HEAD:$BRANCH