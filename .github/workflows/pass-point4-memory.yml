name: Point 4 Memory Boundary
on:
  push:
    branches: [refactor/point4-memory-boundary]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Migrate memory transparency UI
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/MemoryTransparencySettingsPanel.tsx')
          text = path.read_text()
          text = text.replace("import { getDbMemoryState } from '../lib/db';", "import { loadMemoryTransparencyState } from '../services/memoryService';")
          text = text.replace('getDbMemoryState(MEMORY_TRANSPARENCY_READ_OPTIONS)', 'loadMemoryTransparencyState(MEMORY_TRANSPARENCY_READ_OPTIONS)')
          if "from '../lib/db'" in text or 'getDbMemoryState(' in text:
              raise SystemExit('Legacy direct memory persistence dependency remains')
          path.write_text(text)
          PY
          npm install --no-audit --no-fund
          npm run lint
          npx tsc --noEmit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MemoryTransparencySettingsPanel.tsx
          git commit -m 'refactor(memory): route transparency UI through service [point4]'
          git push origin HEAD:$BRANCH
          rm -f .github/workflows/pass-point4-memory.yml
          git add -u .github/workflows/pass-point4-memory.yml
          git commit -m 'chore(point4): remove temporary memory runner' || true
          git push origin HEAD:$BRANCH
