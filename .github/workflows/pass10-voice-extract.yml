name: Pass 10 voice settings extraction

on:
  push:
    branches: [refactor/pass10-settings]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pass10-settings
          token: ${{ secrets.ELARA_MIRROR_TOKEN }}
          fetch-depth: 0

      - name: Replace legacy Voice settings block with canonical panel
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/components/SettingsModal.tsx')
          text = p.read_text()

          import_anchor = "import { loadRateLimits } from '../lib/storage';\n"
          import_line = "import { VoiceChatSettingsPanel } from './VoiceChatSettingsPanel';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('SettingsModal import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          start_marker = '          {/* TAB: VOICE & SPEECH-TO-TEXT */}\n'
          end_marker = '          {/* TAB: GOOGLE WORKSPACE & SYNC */}\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Voice tab boundaries not found')

          replacement = '''          {/* TAB: VOICE & SPEECH-TO-TEXT */}\n          {activeTab === 'voice' && (\n            <VoiceChatSettingsPanel\n              settings={formData}\n              onChange={setFormData}\n            />\n          )}\n\n'''

          text = text[:start] + replacement + text[end:]
          p.write_text(text)
          PY

      - name: Verify canonical Voice route
        run: |
          set -euo pipefail
          grep -q "VoiceChatSettingsPanel" src/components/SettingsModal.tsx
          grep -q "activeTab === 'voice'" src/components/SettingsModal.tsx
          test "$(grep -c "TAB: VOICE & SPEECH-TO-TEXT" src/components/SettingsModal.tsx)" -eq 1

      - name: Typecheck baseline
        continue-on-error: true
        run: npm install --no-audit --no-fund && npm exec tsc -- --noEmit

      - name: Commit extraction and clean temporary workflow
        env:
          TOKEN: ${{ secrets.ELARA_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Elara Architecture Bot'
          git config user.email 'elara-architecture@users.noreply.github.com'
          rm -f .pass10-trigger .github/workflows/pass10-voice-extract.yml
          git add -A
          git commit -m 'refactor: route settings voice tab through canonical panel'
          git push https://x-access-token:${TOKEN}@github.com/cryogenized-spec/Elara-Companion.git HEAD:refactor/pass10-settings
