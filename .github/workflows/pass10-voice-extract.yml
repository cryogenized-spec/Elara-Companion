name: Pass 10 voice settings extraction

on:
  push:
    branches: [refactor/pass10-settings]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pass10-settings
          token: ${{ secrets.ELARA_MIRROR_TOKEN }}
          fetch-depth: 0
      - name: No-op
        run: echo 'Superseded by pass10-pr-patcher.yml'
