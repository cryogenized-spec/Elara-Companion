name: Pass 3 App cleanup

on:
  push:
    branches: [fix/pass3-chat-runtime]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch App runtime boundary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/App.tsx';
          let content = fs.readFileSync(path, 'utf8');

          const start = '    // Background Google Workspace Autonomous Sync Detection';
          const end = '    let effectiveBaseSystemInstruction = baseSystemInstruction;';
          const startIndex = content.indexOf(start);
          const endIndex = content.indexOf(end, startIndex);

          if (startIndex < 0 || endIndex < 0 || endIndex <= startIndex) {
            throw new Error('Pass 3 App cleanup markers not found; refusing to rewrite App.tsx.');
          }

          content = content.slice(0, startIndex)
            + '    // Google live data is now agent-selected through the canonical runtime/tool registry.\n    const backgroundWorkspaceContext = \'\';\n\n'
            + content.slice(endIndex);

          const googleImport = /import \{[\s\S]*?\n\} from '\.\/lib\/googleApi';\n/;
          if (!googleImport.test(content)) {
            throw new Error('Legacy googleApi import block not found; refusing to rewrite App.tsx.');
          }
          content = content.replace(googleImport, "import { getAccessToken } from './lib/googleApi';\n");

          const forbidden = [
            'isGoogleConnected(',
            'getTasks(',
            'getUpcomingCalendarEvents(',
            'listGmailMessages(',
            'searchContacts(',
            'searchKeepNotes(',
            'createKeepNote(',
            'updateKeepNote(',
            'getKeepNote(',
            'createGoogleDoc(',
            'editGoogleDoc(',
            'getGoogleDoc(',
            'searchGoogleDriveDocs(',
          ];
          for (const token of forbidden) {
            if (content.includes(token)) throw new Error(`Legacy Google prefetch call remains: ${token}`);
          }

          fs.writeFileSync(path, content);
          NODE

      - name: Verify and remove temporary workflow
        shell: bash
        run: |
          test "$(grep -c 'canonical runtime/tool registry' src/App.tsx)" = "1"
          git rm .github/workflows/pass3-app-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "refactor: remove legacy Google prefetch from App"
          git push
