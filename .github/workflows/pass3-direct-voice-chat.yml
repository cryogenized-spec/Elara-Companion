name: Pass 3 direct Voice & Chat migration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Replace legacy inline voice tab
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/components/SettingsModal.tsx')
          text = path.read_text()
          additions = """import { VoiceSettingsPanel } from './VoiceSettingsPanel';
          import { ReliabilitySettingsPanel } from './ReliabilitySettingsPanel';
          import { ChatEditorSettingsPanel } from './ChatEditorSettingsPanel';
          import { DEFAULT_VOICE_SETTINGS, normalizeVoiceSettings } from '../lib/voiceSettings';
          import { DEFAULT_RELIABILITY_SETTINGS, normalizeReliabilitySettings } from '../lib/reliabilitySettings';
          """
          marker = "import { loadRateLimits } from '../lib/storage';\n"
          if marker not in text: raise SystemExit('Pass 3 failed: import anchor missing')
          if "from './VoiceSettingsPanel'" not in text: text = text.replace(marker, marker + additions, 1)
          state_anchor = "  const [importStatus, setImportStatus] = useState<string | null>(null);\n"
          if state_anchor not in text: raise SystemExit('Pass 3 failed: state anchor missing')
          if 'voiceSection' not in text: text = text.replace(state_anchor, state_anchor + "  const [voiceSection, setVoiceSection] = useState<'voice' | 'chat' | 'reliability'>('voice');\n", 1)
          save_old = "  const handleSave = () => {\n    onSaveSettings(formData);\n    onClose();\n  };"
          save_new = "  const handleSave = () => {\n    onSaveSettings({\n      ...formData,\n      voiceSettings: normalizeVoiceSettings(formData.voiceSettings),\n      reliabilitySettings: normalizeReliabilitySettings(formData.reliabilitySettings),\n    });\n    onClose();\n  };"
          if save_old not in text: raise SystemExit('Pass 3 failed: save handler missing')
          text = text.replace(save_old, save_new, 1)
          text = text.replace('<span>Voice & Speech</span>', '<span>Voice & Chat</span>', 1)
          start_marker = "          {/* TAB: VOICE & SPEECH-TO-TEXT */}"
          if start_marker not in text: raise SystemExit('Pass 3 failed: legacy voice tab marker missing')
          start = text.index(start_marker)
          end_marker = "          {/* TAB: GOOGLE WORKSPACE & SYNC */}"
          if end_marker not in text[start:]: raise SystemExit('Pass 3 failed: workspace marker missing')
          end = start + text[start:].index(end_marker)
          replacement = '''          {/* TAB: VOICE & CHAT */}\n          {activeTab === 'voice' && (\n            <div className="space-y-5">\n              <section className="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4">\n                <div className="grid grid-cols-3 gap-1 rounded-xl border border-zinc-800 bg-zinc-950/60 p-1">\n                  {([\n                    ['voice', 'Voice Input'],\n                    ['chat', 'Chat & Editor'],\n                    ['reliability', 'Reliability'],\n                  ] as const).map(([id, label]) => (\n                    <button key={id} type="button" onClick={() => setVoiceSection(id)} className={`rounded-lg px-2 py-2 text-[11px] font-medium transition-colors ${voiceSection === id ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-500 hover:bg-zinc-900 hover:text-zinc-300'}`}>{label}</button>\n                  ))}\n                </div>\n              </section>\n              {voiceSection === 'voice' && <VoiceSettingsPanel value={normalizeVoiceSettings(formData.voiceSettings || DEFAULT_VOICE_SETTINGS)} onChange={(voiceSettings) => setFormData((current) => ({ ...current, voiceSettings }))} />}\n              {voiceSection === 'chat' && <ChatEditorSettingsPanel />}\n              {voiceSection === 'reliability' && <ReliabilitySettingsPanel settings={normalizeReliabilitySettings(formData.reliabilitySettings || DEFAULT_RELIABILITY_SETTINGS)} preferredModel={formData.model} onApply={(reliabilitySettings) => setFormData((current) => ({ ...current, reliabilitySettings }))} embedded />}\n            </div>\n          )}\n\n'''
          text = text[:start] + replacement + text[end:]
          legacy = ['speechLanguage', 'speechAutoSend', 'speechAutoCapitalize', 'speechPauseTimeout']
          residues = [needle for needle in legacy if needle in text]
          if residues: raise SystemExit(f'Pass 3 failed: legacy voice fields remain in SettingsModal: {residues}')
          if 'Live Speech-to-Text & Voice Dictation' in text or 'Browser Native Web Speech API' in text: raise SystemExit('Pass 3 failed: legacy voice surface remains')
          path.write_text(text)
          PY
      - name: Remove migration workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/pass3-direct-voice-chat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SettingsModal.tsx .github/workflows/pass3-direct-voice-chat.yml
          git diff --cached --check
          git commit -m "refactor: integrate direct Voice & Chat settings"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
