name: Pass 4 manual chat extraction

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pass 4 branch
        uses: actions/checkout@v4
        with:
          ref: refactor/pass4-chat-runtime
          token: ${{ secrets.ELARA_MIRROR_TOKEN }}
          fetch-depth: 0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Extract chat stream controller
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          start_marker = "  // Stream Response from Server API\n"
          end_marker = "  // Send Message\n"
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Pass 4 stream block markers not found')

          block = text[start:end]
          if 'const streamAssistantResponse = async' not in block:
              raise SystemExit('streamAssistantResponse was not found in extracted block')
          if 'const generateConversationTitle = async' not in block:
              raise SystemExit('generateConversationTitle was not found in extracted block')

          hook_import = "import { useChatStreamController } from './features/chat/useChatStreamController';\n"
          hook_anchor = "import { useConversationController } from './features/conversations/useConversationController';\n"
          if hook_import not in text:
              text = text.replace(hook_anchor, hook_anchor + hook_import, 1)

          controller_call = '''  const {\n    streamAssistantResponse,\n    generateConversationTitle,\n  } = useChatStreamController({\n    conversations,\n    settings,\n    memoryState,\n    setConversations,\n    setMemoryState,\n    setIsStreaming,\n    abortControllerRef,\n    userHasScrolledUpRef,\n  });\n\n'''
          text = text[:start] + controller_call + text[end:]

          hook_body = block.replace(start_marker, '', 1)
          hook_body = hook_body.lstrip('\n')

          imports = '''import type { Dispatch, MutableRefObject, SetStateAction } from 'react';\nimport type { Conversation, CanvasData, ElaraSettings, MemoryScratchpadState } from '../../types';\nimport { DEFAULT_PERSONA_PROTOCOL, DEFAULT_INTIMACY_MODULE, DEFAULT_RUNTIME_RULES } from '../../constants/defaultPrompt';\nimport { exportAllDataJSON, incrementRateLimit, generateUniqueId } from '../../lib/storage';\nimport { loadUserProfileNotes, loadActiveScratchpad, buildSystemPayload } from '../../lib/contextManager';\nimport { getAccessToken } from '../../lib/googleApi';\nimport { getActiveThoughtSentence, parseThoughtSteps, extractThoughtsAndContent } from '../../utils/thoughtUtils';\nimport { extractCanvases } from '../../utils/canvasUtils';\nimport { runDirectGeminiStream, runDirectMemoryExtraction, runDirectTitleGeneration } from '../../lib/geminiDirectClient';\nimport { applyMemoryActions } from '../../lib/memoryProcessor';\nimport { createBackgroundChatJob, isBackgroundRuntimeEnabled, persistBackgroundJob, removePersistedBackgroundJob, waitForBackgroundChatJob } from '../../lib/backgroundChatClient';\nimport { notifyBackgroundCompletion } from '../../lib/backgroundService';\nimport { createStreamUiScheduler } from '../../lib/streamUiScheduler';\nimport { saveAgentArtifact, getWorkspace, saveWorkspace } from '../../lib/workspaceStorage';\nimport { setDbMemoryState } from '../../lib/db';\n\n'''

          args = '''export type ChatStreamControllerArgs = {\n  conversations: Conversation[];\n  settings: ElaraSettings;\n  memoryState: MemoryScratchpadState;\n  setConversations: Dispatch<SetStateAction<Conversation[]>>;\n  setMemoryState: Dispatch<SetStateAction<MemoryScratchpadState>>;\n  setIsStreaming: Dispatch<SetStateAction<boolean>>;\n  abortControllerRef: MutableRefObject<AbortController | null>;\n  userHasScrolledUpRef: MutableRefObject<boolean>;\n};\n\nexport function useChatStreamController({\n  conversations,\n  settings,\n  memoryState,\n  setConversations,\n  setMemoryState,\n  setIsStreaming,\n  abortControllerRef,\n  userHasScrolledUpRef,\n}: ChatStreamControllerArgs) {\n\n'''

          closing = '''\n  return { streamAssistantResponse, generateConversationTitle };\n}\n'''
          controller_file = Path('src/features/chat/useChatStreamController.ts')
          controller_file.parent.mkdir(parents=True, exist_ok=True)
          controller_file.write_text(imports + args + hook_body + closing)
          app.write_text(text)
          PY

      - name: Structural verification
        run: |
          set -euo pipefail
          test -f src/features/chat/useChatStreamController.ts
          ! grep -q "// Stream Response from Server API" src/App.tsx
          grep -q "useChatStreamController" src/App.tsx
          grep -q "const streamAssistantResponse = async" src/features/chat/useChatStreamController.ts
          grep -q "const generateConversationTitle = async" src/features/chat/useChatStreamController.ts

      - name: Typecheck (record known baseline errors)
        continue-on-error: true
        run: npm exec tsc -- --noEmit

      - name: Commit Pass 4 extraction
        env:
          TOKEN: ${{ secrets.ELARA_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Elara Architecture Bot'
          git config user.email 'elara-architecture@users.noreply.github.com'
          git add src/App.tsx src/features/chat/useChatStreamController.ts
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: Pass 4 extract chat stream controller'
          git push https://x-access-token:${TOKEN}@github.com/cryogenized-spec/Elara-Companion.git HEAD:refactor/pass4-chat-runtime
