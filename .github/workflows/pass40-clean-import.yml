name: Pass 40 clean import

on:
  push:
    branches:
      - pass40-chat-runtime-extraction

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove unused Google contract import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/chat/useChatStreamController.ts')
          s = p.read_text()
          s = s.replace(
              "import { geminiRuntimeContract, backgroundRuntimeContract, googleContract } from '../../contracts/implementations';",
              "import { geminiRuntimeContract, backgroundRuntimeContract } from '../../contracts/implementations';",
          )
          if 'googleContract' in s:
              raise SystemExit('googleContract reference remains in Chat controller')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/chat/useChatStreamController.ts
          git commit -m "fix(chat): remove unused Google runtime import"
          git push
          git rm .github/workflows/pass40-clean-import.yml
          git commit -m "chore: remove one-shot Pass 40 cleanup workflow"
          git push
