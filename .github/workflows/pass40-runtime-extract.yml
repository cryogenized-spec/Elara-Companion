name: Pass 40 controller patch

on:
  push:
    branches:
      - pass40-chat-runtime-extraction

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Chat controller onto runtime boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/features/chat/useChatStreamController.ts')
          s = p.read_text()

          s = s.replace(
              "import { getAccessToken } from '../../lib/googleApi';\n", ""
          )
          s = s.replace(
              "import { runDirectGeminiStream, runDirectMemoryExtraction, runDirectTitleGeneration } from '../../lib/geminiDirectClient';",
              "import { runDirectMemoryExtraction, runDirectTitleGeneration } from '../../lib/geminiDirectClient';"
          )
          s = s.replace(
              "import { createBackgroundChatJob, isBackgroundRuntimeEnabled, persistBackgroundJob, removePersistedBackgroundJob, waitForBackgroundChatJob } from '../../lib/backgroundChatClient';\n",
              ""
          )
          s = s.replace(
              "import { notifyBackgroundCompletion } from '../../lib/backgroundService';\n", ""
          )
          s = s.replace(
              "import { setDbMemoryState } from '../../lib/db';\n",
              "import { geminiRuntimeContract, backgroundRuntimeContract } from '../../contracts/implementations';\nimport { executeChatRuntime } from '../../services/chatRuntimeService';\n"
          )

          start_marker = "      // Optional durable server-side execution. Once accepted, never fall back to another Gemini call."
          end_marker = "\n\n      isDone = true;"
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('runtime block markers not found')

          replacement = """      // Runtime execution is owned by the application runtime boundary.\n      const runtimeResult = await executeChatRuntime({\n        conversationId: targetConvId,\n        assistantMessageId: assistantMsgId,\n        message: messageText,\n        image: attachedImage,\n        history: historyPayload,\n        systemPrompt: formattedSystemPrompt,\n        model: settings.model || 'gemini-3.7-flash',\n        temperature: settings.temperature,\n        maxOutputTokens: settings.maxOutputTokens,\n        topP: settings.topP,\n        topK: settings.topK,\n        thinkingBudget: settings.thinkingBudget,\n        apiKey: settings.apiKey?.trim(),\n        workspace: getWorkspace(),\n        googleToken: undefined,\n        signal: controller.signal,\n        runtime: geminiRuntimeContract,\n        background: backgroundRuntimeContract,\n        onChunk: handleChunkArrival,\n      });\n      durableJobAccepted = runtimeResult.durable;"""

          s = s[:start] + replacement + s[end:]
          s = s.replace(
              "        workspace: getWorkspace(),\n        googleToken: undefined,\n",
              "        workspace: getWorkspace(),\n"
          )

          p.write_text(s)
          PY

      - name: Update runtime service result contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/chatRuntimeService.ts')
          s = p.read_text()
          s = s.replace('): Promise<void> {', '): Promise<{ durable: boolean }> {')
          s = s.replace("    request.background.removeJob(durableJob.id);\n    return;", "    request.background.removeJob(durableJob.id);\n    return { durable: true };")
          s = s.replace("  await request.runtime.stream({", "  await request.runtime.stream({")
          if not s.rstrip().endswith('}'): raise SystemExit('unexpected runtime service shape')
          s = s.rstrip()[:-1] + "  return { durable: false };\n}\n"
          p.write_text(s)
          PY

      - name: Verify and commit
        run: |
          grep -q "executeChatRuntime" src/features/chat/useChatStreamController.ts
          grep -q "export async function executeChatRuntime" src/services/chatRuntimeService.ts
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/chat/useChatStreamController.ts src/services/chatRuntimeService.ts
          git commit -m "refactor(chat): route execution through runtime boundary" || true
          git push

      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/pass40-runtime-extract.yml
          git commit -m "chore: remove one-shot Pass 40 patch workflow"
          git push
