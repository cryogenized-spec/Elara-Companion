name: Pass 41 refactor
on:
  push:
    branches: [pass41-memory-tool-boundary]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Pass 41 boundary extraction
        env:
          BRANCH: pass41-memory-tool-boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          
          p = Path('src/features/chat/useChatStreamController.ts')
          s = p.read_text()
          s = s.replace(
              "import { runDirectMemoryExtraction, runDirectTitleGeneration } from '../../lib/geminiDirectClient';\nimport { applyMemoryActions } from '../../lib/memoryProcessor';\n",
              "import { runDirectTitleGeneration } from '../../lib/geminiDirectClient';\n",
          )
          s = s.replace(
              "import { geminiRuntimeContract, backgroundRuntimeContract } from '../../contracts/implementations';\nimport { executeChatRuntime } from '../../services/chatRuntimeService';\nimport { setDbMemoryState } from '../../lib/db';\n",
              "import { geminiRuntimeContract, backgroundRuntimeContract, memoryContract } from '../../contracts/implementations';\nimport { executeChatRuntime } from '../../services/chatRuntimeService';\nimport { extractAndPersistConversationMemory } from '../../services/chatMemoryService';\n",
          )
          old = '''      // Autonomous Background Long-Term Memory Extraction\n      if (accumulatedText && accumulatedText.trim()) {\n        if (settings.apiKey && settings.apiKey.trim()) {\n          runDirectMemoryExtraction(\n            settings.apiKey.trim(),\n            messageText,\n            accumulatedText,\n            memoryState.memories,\n            settings.userName || 'User'\n          ).then((actions) => {\n            if (actions && Array.isArray(actions) && actions.length > 0) {\n              setMemoryState((prev) => {\n                const updated = applyMemoryActions(prev, actions, targetConvId);\n                setDbMemoryState(updated);\n                return updated;\n              });\n            }\n          });\n        } else {\n          fetch('/api/memory/analyze', {\n            method: 'POST',\n            headers: { 'Content-Type': 'application/json' },\n            body: JSON.stringify({\n              userMessage: messageText,\n              assistantResponse: accumulatedText,\n              currentMemories: memoryState.memories,\n              userName: settings.userName || 'User',\n            }),\n          })\n            .then((res) => res.json())\n            .then((data) => {\n              if (data.actions && Array.isArray(data.actions) && data.actions.length > 0) {\n                setMemoryState((prev) => {\n                  const updated = applyMemoryActions(prev, data.actions, targetConvId);\n                  setDbMemoryState(updated);\n                  return updated;\n                });\n              }\n            })\n            .catch((err) => console.warn('Background memory extraction notice:', err));\n        }\n      }\n'''
          new = '''      // Memory extraction is owned by the canonical memory boundary.\n      void extractAndPersistConversationMemory({\n        apiKey: settings.apiKey?.trim(),\n        userMessage: messageText,\n        assistantResponse: accumulatedText,\n        memoryState,\n        userName: settings.userName || 'User',\n        conversationId: targetConvId,\n        memory: memoryContract,\n      });\n'''
          if old not in s:
              raise SystemExit('memory extraction block not found')
          s = s.replace(old, new)
          p.write_text(s)
          
          p = Path('src/lib/geminiDirectClient.ts')
          s = p.read_text()
          s = s.replace(
              "  executeAgentToolCall,\n  mergeTouchedArtifactIds,\n  MAX_AGENT_ITERATIONS,\n",
              "  mergeTouchedArtifactIds,\n  MAX_AGENT_ITERATIONS,\n",
          )
          s = s.replace(
              "} from './chatRuntime';\n",
              "} from './chatRuntime';\nimport { executeAgentToolCall } from '../services/agentToolExecutionService';\n",
              1,
          )
          p.write_text(s)
          
          p = Path('src/lib/chatRuntime.ts')
          s = p.read_text()
          s = s.replace("import { publishApplicationEvent } from '../events/applicationEventBus';\n", "")
          s = s.replace("import { agentToolDeclarations, executeAgentTool, AgentToolExecution, getAgentToolDeclarations } from './agentToolRegistry';", "import { agentToolDeclarations, getAgentToolDeclarations } from './agentToolRegistry';")
          s = s.replace("import { recordLiveToolActivity } from './thinkingLiveRuntime';\n", "")
          s = s.replace("import type { ToolExposurePolicy } from '../security/toolExposurePolicy';\n", "import type { ToolExposurePolicy } from '../security/toolExposurePolicy';\n")
          start = s.find("export async function executeAgentToolCall(")
          end = s.find("export function mergeTouchedArtifactIds(", start)
          if start == -1 or end == -1:
              raise SystemExit('tool execution block not found')
          merge_end = s.find("\n}\n", end)
          if merge_end == -1:
              raise SystemExit('tool merge block not found')
          # Keep mergeTouchedArtifactIds in the new service; remove both functions from chatRuntime.
          merge_end += 3
          s = s[:start] + s[merge_end:]
          p.write_text(s)
          
          p = Path('server/routes/chat.ts')
          s = p.read_text()
          s = s.replace("  executeAgentToolCall,\n", "")
          marker = "} from \"../../src/lib/chatRuntime\";\n"
          if marker not in s:
              raise SystemExit('server chat import marker not found')
          s = s.replace(marker, marker + "import { executeAgentToolCall } from \"../../src/services/agentToolExecutionService\";\n", 1)
          p.write_text(s)
          
          p = Path('scripts/automation-executor.mjs')
          s = p.read_text()
          s = s.replace("    executeAgentToolCall,\n", "")
          marker = "  } = await import('../src/lib/chatRuntime.ts');\n"
          if marker not in s:
              raise SystemExit('automation import marker not found')
          s = s.replace(marker, marker + "  const { executeAgentToolCall } = await import('../src/services/agentToolExecutionService.ts');\n", 1)
          p.write_text(s)
          PY
          
          git add src/features/chat/useChatStreamController.ts src/lib/geminiDirectClient.ts src/lib/chatRuntime.ts server/routes/chat.ts scripts/automation-executor.mjs
          git commit -m "refactor(memory-tools): extract Chat memory and tool boundaries"
          git push origin "$BRANCH"
          
          # The workflow is intentionally self-removing once its patch has landed.
          git rm .github/workflows/pass41-apply.yml
          git commit -m "chore: remove one-shot Pass 41 refactor workflow"
          git push origin "$BRANCH"
