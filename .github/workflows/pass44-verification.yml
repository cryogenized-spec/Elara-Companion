name: Pass 44 verification

on:
  push:
    branches:
      - pass44-chat-provider-state-boundaries
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run benchmark:memory
