name: Pass 5 Workspace extraction

on:
  pull_request_target:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.ELARA_MIRROR_TOKEN }}
          fetch-depth: 0
      - name: Extract Workspace controller
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx'); text=app.read_text()
          text=text.replace("import { useChatStreamController } from './features/chat/useChatStreamController';\n", "import { useChatStreamController } from './features/chat/useChatStreamController';\nimport { useWorkspaceController } from './features/workspace/useWorkspaceController';\n", 1)
          text=text.replace("  const [activeArtifactId, setActiveArtifactId] = useState<string | null>(null);\n", "", 1)
          old="""  const handleOpenArtifact = (artifactId: string) => {\n    setActiveArtifact(artifactId);\n    setActiveArtifactId(artifactId);\n    setCurrentView('workspace');\n  };\n"""
          if old not in text: raise SystemExit('workspace handler not found')
          new="""  const { activeArtifactId, handleOpenArtifact, handleSelectArtifact, handleBackToChat } = useWorkspaceController({\n    setCurrentView,\n  });\n"""
          text=text.replace(old,new,1)
          text=text.replace("onSelectArtifact={(id) => setActiveArtifactId(id)}", "onSelectArtifact={handleSelectArtifact}", 1)
          text=text.replace("onBackToChat={() => setCurrentView('chat')}", "onBackToChat={handleBackToChat}", 1)
          out=Path('src/features/workspace/useWorkspaceController.ts'); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text("""import { useCallback, useState } from 'react';\nimport type { Dispatch, SetStateAction } from 'react';\nimport { setActiveArtifact } from '../../lib/workspaceStorage';\n\nexport type WorkspaceControllerArgs = {\n  setCurrentView: Dispatch<SetStateAction<'chat' | 'workspace'>>;\n};\n\nexport function useWorkspaceController({ setCurrentView }: WorkspaceControllerArgs) {\n  const [activeArtifactId, setActiveArtifactId] = useState<string | null>(null);\n\n  const handleOpenArtifact = useCallback((artifactId: string) => {\n    setActiveArtifact(artifactId);\n    setActiveArtifactId(artifactId);\n    setCurrentView('workspace');\n  }, [setCurrentView]);\n\n  const handleSelectArtifact = useCallback((artifactId: string) => {\n    setActiveArtifact(artifactId);\n    setActiveArtifactId(artifactId);\n  }, []);\n\n  const handleBackToChat = useCallback(() => {\n    setCurrentView('chat');\n  }, [setCurrentView]);\n\n  return { activeArtifactId, handleOpenArtifact, handleSelectArtifact, handleBackToChat };\n}\n""")
          app.write_text(text)
          PY
      - name: Verify
        run: |
          test -f src/features/workspace/useWorkspaceController.ts
          grep -q "useWorkspaceController" src/App.tsx
          grep -q "onSelectArtifact={handleSelectArtifact}" src/App.tsx
          grep -q "onBackToChat={handleBackToChat}" src/App.tsx
      - name: Commit
        env:
          TOKEN: ${{ secrets.ELARA_MIRROR_TOKEN }}
        run: |
          git config user.name 'Elara Architecture Bot'
          git config user.email 'elara-architecture@users.noreply.github.com'
          git add src/App.tsx src/features/workspace/useWorkspaceController.ts
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: Pass 5 workspace orchestration extraction'
          git push https://x-access-token:${TOKEN}@github.com/cryogenized-spec/Elara-Companion.git HEAD:${GITHUB_HEAD_REF}
