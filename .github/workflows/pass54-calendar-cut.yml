name: Pass 54 Calendar Cut

on:
  push:
    branches:
      - pass54-calendar-settings-cut

permissions:
  contents: write

jobs:
  cut:
    if: !contains(github.event.head_commit.message, '[pass54-bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply Calendar migration and deletion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path('src/components/SettingsModal.tsx')
          text = settings.read_text()

          text = text.replace("import { loadRateLimits } from '../lib/storage';\n", "import { loadRateLimits } from '../lib/storage';\nimport { googleCalendarContract } from '../contracts/implementations';\nimport type { GoogleCalendarEvent } from '../contracts';\n")
          text = text.replace('  getUpcomingCalendarEvents,\n', '')
          text = text.replace('  CalendarEventItem,\n', '')
          text = text.replace('CalendarEventItem[]', 'GoogleCalendarEvent[]')
          text = text.replace('await getUpcomingCalendarEvents(', 'await googleCalendarContract.getUpcoming(')
          settings.write_text(text)

          api = Path('src/lib/googleApi.ts')
          text = api.read_text()

          calendar_block = re.compile(
              r"// ---------------- Calendar / Tasks ----------------\n"
              r"export interface CalendarEventItem \{.*?\n"
              r"export async function createCalendarEvent\(.*?\n"
              r"export interface TaskItem",
              re.S,
          )
          replacement = '// ---------------- Tasks ----------------\nexport interface TaskItem'
          text, count = calendar_block.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'Expected exactly one Calendar implementation block, found {count}')

          compat = "    case 'get_calendar_events': return getUpcomingCalendarEvents(args?.maxResults||10);\n"
          if text.count(compat) != 1:
              raise SystemExit(f'Expected one legacy calendar compatibility route, found {text.count(compat)}')
          text = text.replace(compat, '')
          api.write_text(text)

          # Hard postconditions: the old symbols and implementation URLs/functions must be gone.
          settings_text = settings.read_text()
          api_text = api.read_text()
          for needle in ('getUpcomingCalendarEvents', 'CalendarEventItem', 'createCalendarEvent'):
              if needle in settings_text or needle in api_text:
                  raise SystemExit(f'Legacy Calendar symbol remains after migration: {needle}')
          if 'case \'get_calendar_events\'' in api_text:
              raise SystemExit('Legacy get_calendar_events compatibility route remains')
          print('Pass 54 source transformation verified.')
          PY

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Memory benchmark
        run: npm run benchmark:memory

      - name: Commit verified cut and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/pass54-calendar-cut.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SettingsModal.tsx src/lib/googleApi.ts .github/workflows/pass54-calendar-cut.yml
          git commit -m 'refactor(google): remove legacy Calendar wiring [pass54-bot]'
          git push origin HEAD:${GITHUB_REF_NAME}
