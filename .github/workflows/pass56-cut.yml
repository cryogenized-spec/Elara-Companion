name: Pass 56 Workspace Cut

on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/pass56-workspace-editor-service]

permissions:
  contents: write

jobs:
  cut:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.ref == 'refactor/pass56-workspace-editor-service' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: refactor/pass56-workspace-editor-service
          fetch-depth: 2
          persist-credentials: true

      - name: Migrate WorkspaceView to editor service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/WorkspaceView.tsx')
          text = p.read_text()
          old_storage = "import { createArtifact, deleteArtifact, getWorkspace, saveWorkspace, setActiveArtifact, updateArtifact } from '../lib/workspaceStorage';"
          old_revision = "import { compareRevisions, createCheckpoint, restoreRevision } from '../lib/revisionUtils';"
          if old_storage not in text or old_revision not in text:
              raise SystemExit('Expected WorkspaceView import surface not found')
          text = text.replace(old_storage, "import { workspaceEditorService } from '../services/workspaceEditorService';")
          text = text.replace(old_revision, '')
          replacements = {
              'compareRevisions(': 'workspaceEditorService.compareRevisions(',
              'createCheckpoint(': 'workspaceEditorService.checkpoint(',
              'restoreRevision(': 'workspaceEditorService.restoreRevision(',
              'getWorkspace()': 'workspaceEditorService.getWorkspace()',
              'saveWorkspace(': 'workspaceEditorService.saveWorkspace(',
              'setActiveArtifact(': 'workspaceEditorService.selectArtifact(',
              'createArtifact(': 'workspaceEditorService.createArtifact(',
              'deleteArtifact(': 'workspaceEditorService.deleteArtifact(',
              'updateArtifact(': 'workspaceEditorService.updateArtifact(',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Verify direct storage imports are gone
        run: |
          ! grep -n "../lib/workspaceStorage\|../lib/revisionUtils" src/components/WorkspaceView.tsx
          grep -n "workspaceEditorService" src/components/WorkspaceView.tsx

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Memory benchmark
        run: npm run benchmark:memory

      - name: Restore workflow and commit
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/pass56-cut.yml docs/PASS56_CUT_TRIGGER.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/WorkspaceView.tsx src/services/workspaceEditorService.ts .github/workflows/pass56-cut.yml docs/PASS56_CUT_TRIGGER.md
          git commit -m 'refactor(workspace): move editor persistence behind service [pass56-bot]'
          git push origin HEAD:refs/heads/refactor/pass56-workspace-editor-service
