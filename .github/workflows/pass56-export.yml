name: Pass 56 export verifier

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  transform:
    if: ${{ github.event.pull_request.head.ref == 'refactor/pass56-workspace-editor-service' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Transform WorkspaceView
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/WorkspaceView.tsx')
          text = p.read_text()
          old_storage = "import { createArtifact, deleteArtifact, getWorkspace, saveWorkspace, setActiveArtifact, updateArtifact } from '../lib/workspaceStorage';"
          old_revision = "import { compareRevisions, createCheckpoint, restoreRevision } from '../lib/revisionUtils';"
          if old_storage not in text or old_revision not in text:
              raise SystemExit('Expected import surface not found')
          text = text.replace(old_storage, "import { workspaceEditorService } from '../services/workspaceEditorService';")
          text = text.replace(old_revision, '')
          p.write_text(text)
          PY

      - name: Validate import boundary
        run: |
          ! grep -n "../lib/workspaceStorage\|../lib/revisionUtils" src/components/WorkspaceView.tsx
          grep -n "workspaceEditorService" src/components/WorkspaceView.tsx

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Memory benchmark
        run: npm run benchmark:memory

      - name: Commit verified source and remove verifier
        run: |
          rm -f .github/workflows/pass56-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/WorkspaceView.tsx .github/workflows/pass56-export.yml
          git commit -m 'refactor(workspace): route WorkspaceView editor persistence through service [pass56]'
          git push origin HEAD:refs/heads/refactor/pass56-workspace-editor-service
