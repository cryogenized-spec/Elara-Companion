name: Pass 59 Gmail extraction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Extract Gmail provider
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/googleApi.ts')
          text = path.read_text()
          start_marker = '// ---------------- Gmail ----------------'
          end_marker = '// ---------------- Docs / Drive ----------------'
          start = text.index(start_marker)
          end = text.index(end_marker)
          gmail = text[start:end].strip() + '\n'

          gmail = gmail.replace('await requestGoogleAuth()', "await getGoogleGmailAccessToken('gmail.read')", 1)
          gmail = gmail.replace('await requestGoogleAuth()', "await getGoogleGmailAccessToken('gmail.read')", 1)
          gmail = gmail.replace('await requestGoogleAuth()', "await getGoogleGmailAccessToken('gmail.compose')", 1)
          gmail = gmail.replace('await requestGoogleAuth()', "await getGoogleGmailAccessToken('gmail.send')", 1)

          helper = """import { googleCapabilities, googleIdentity } from './googleWorkspaceService';\nimport type { GoogleCapability } from '../lib/googleWorkspaceService';\n\nasync function getGoogleGmailAccessToken(capability: GoogleCapability): Promise<string> {\n  const token = googleIdentity.getAccessToken();\n  if (token && googleCapabilities.isGranted(googleCapabilities.getGrantedScopes(), capability)) return token;\n  return googleIdentity.requestCapabilityAuthorization(googleCapabilities.getScopes(capability), false);\n}\n\nasync function parseGoogleApiError(res: Response, prefix: string): Promise<string> {\n  const raw = await res.text().catch(() => '');\n  try {\n    const json = JSON.parse(raw);\n    return `${prefix}: ${json?.error?.message || json?.error || `HTTP ${res.status}`}`;\n  } catch {\n    return `${prefix}: ${raw || `HTTP ${res.status}`}`;\n  }\n}\n\nfunction authHeaders(token: string) { return { Authorization: `Bearer ${token}` }; }\nfunction jsonHeaders(token: string) { return { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }; }\n\nfunction encodeBase64Url(value: string): string {\n  const bytes = new TextEncoder().encode(value);\n  let binary = '';\n  bytes.forEach((b) => { binary += String.fromCharCode(b); });\n  return btoa(binary).replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=+$/, '');\n}\n\n"""
          gmail_body = gmail.replace(start_marker + '\n', '')
          if 'import type { GoogleCapability }' in helper:
            helper = helper.replace("import type { GoogleCapability } from '../lib/googleWorkspaceService';", "import type { GoogleCapability } from './googleWorkspaceService';")
          service = helper + gmail_body
          Path('src/services/googleGmailService.ts').write_text(service)

          exports = "// Gmail compatibility export. Implementation lives in the canonical Gmail service.\nexport { listGmailMessages, getGmailMessageDetails, createGmailDraft, sendGmailMessage } from '../services/googleGmailService';\nexport type { GmailMessageSummary, GmailMessageFull } from '../services/googleGmailService';\n\n"
          path.write_text(text[:start] + exports + text[end:])
          PY

          npm install --no-audit --no-fund
          npm run lint
          npx tsc --noEmit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/googleApi.ts src/services/googleGmailService.ts
          git commit -m 'refactor(google): extract Gmail provider service [pass59]'
          git push origin HEAD:$BRANCH

      - name: Remove extraction runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin $BRANCH
          git checkout $BRANCH
          rm -f .github/workflows/pass59-google-gmail-extract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/pass59-google-gmail-extract.yml
          git commit -m 'chore(pass59): remove temporary extraction runner' || true
          git push origin HEAD:$BRANCH
