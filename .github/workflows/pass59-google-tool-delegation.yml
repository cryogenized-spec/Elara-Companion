name: Pass 59 Google Tool Delegation
on:
  push:
    branches: [refactor/pass59-google-tools]
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Delegate Google agent tools to canonical services
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          sheets = Path('src/services/googleSheetsService.ts')
          text = sheets.read_text()
          text = text.replace(
            "async function getGoogleFamilyAccessToken(capability: GoogleCapability): Promise<string> {\n  const token = googleIdentity.getAccessToken();",
            "async function getGoogleFamilyAccessToken(capability: GoogleCapability, passedToken?: string): Promise<string> {\n  if (passedToken?.trim()) return passedToken.trim();\n  const token = googleIdentity.getAccessToken();"
          )
          text = text.replace("createGoogleSheet(title:string,headerRow?:string[]):Promise<SheetMetadata>{const token=await getGoogleFamilyAccessToken('sheets.write');",
                              "createGoogleSheet(title:string,headerRow?:string[],passedToken?:string):Promise<SheetMetadata>{const token=await getGoogleFamilyAccessToken('sheets.write',passedToken);")
          text = text.replace("await appendSheetRow(d.spreadsheetId,'A1',[headerRow]);",
                              "await appendSheetRow(d.spreadsheetId,'A1',[headerRow],token);")
          text = text.replace("getSpreadsheetDetails(spreadsheetId:string):Promise<SheetMetadata>{const token=await getGoogleFamilyAccessToken('sheets.read');",
                              "getSpreadsheetDetails(spreadsheetId:string,passedToken?:string):Promise<SheetMetadata>{const token=await getGoogleFamilyAccessToken('sheets.read',passedToken);")
          text = text.replace("readSheetValues(spreadsheetId:string,range='A1:Z100'):Promise<{range:string;values:any[][]}>{const token=await getGoogleFamilyAccessToken('sheets.read');",
                              "readSheetValues(spreadsheetId:string,range='A1:Z100',passedToken?:string):Promise<{range:string;values:any[][]}>{const token=await getGoogleFamilyAccessToken('sheets.read',passedToken);")
          text = text.replace("appendSheetRow(spreadsheetId:string,range='A1',rows:any[][]):Promise<{updatedRange:string;updatedRows:number}>{const token=await getGoogleFamilyAccessToken('sheets.write');",
                              "appendSheetRow(spreadsheetId:string,range='A1',rows:any[][],passedToken?:string):Promise<{updatedRange:string;updatedRows:number}>{const token=await getGoogleFamilyAccessToken('sheets.write',passedToken);")
          text = text.rstrip() + "\nexport async function writeSheetValues(spreadsheetId:string,range:string,values:any[][],passedToken?:string):Promise<{updatedRange:string;updatedCells:number;updatedRows:number}>{const token=await getGoogleFamilyAccessToken('sheets.write',passedToken);const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(spreadsheetId)}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`,{method:'PUT',headers:jsonHeaders(token),body:JSON.stringify({range,majorDimension:'ROWS',values})});if(!res.ok)throw new Error(await parseGoogleApiError(res,'Failed to write Google Sheet range'));const d=await res.json();return {updatedRange:d.updatedRange||range,updatedCells:d.updatedCells||0,updatedRows:d.updatedRows||values.length};}\n"
          text += "export async function batchUpdateGoogleSheet(spreadsheetId:string,requests:any[],passedToken?:string):Promise<{replies:any[]}>{const token=await getGoogleFamilyAccessToken('sheets.write',passedToken);const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(spreadsheetId)}:batchUpdate`,{method:'POST',headers:jsonHeaders(token),body:JSON.stringify({requests})});if(!res.ok)throw new Error(await parseGoogleApiError(res,'Failed to batch update Google Sheet'));const d=await res.json();return {replies:d.replies||[]};}\n"
          sheets.write_text(text)

          agent = Path('src/lib/googleAgentTools.ts')
          text = agent.read_text()
          marker = 'export async function executeGoogleAgentTool'
          start = text.index(marker)
          helper_start = text.index('async function writeSheetValues', start)
          replacement = """export async function executeGoogleAgentTool(toolName: string, args: any, accessToken?: string): Promise<ToolResult> {
  const token = requireToken(accessToken);
  if (!token) return { success: false, provider: toolName.includes('keep') ? 'google_keep' : 'google_sheets', errorCode: 'GOOGLE_AUTH_REQUIRED', message: 'Google authorization is required before this tool can run.', requiresUserAuth: true };
  const safeArgs = args && typeof args === 'object' ? args : {};
  try {
    switch (toolName) {
      case 'create_google_sheet': {
        const data = await createGoogleSheet(String(safeArgs.title || 'Elara Spreadsheet'), Array.isArray(safeArgs.headers) ? safeArgs.headers.map(String) : undefined, token);
        return { success: true, provider: 'google_sheets', operation: 'create', spreadsheetId: data.spreadsheetId, title: data.title, spreadsheetUrl: data.spreadsheetUrl };
      }
      case 'read_google_sheet': {
        const data = await getSpreadsheetDetails(String(safeArgs.spreadsheetId || '').trim(), token);
        return { success: true, provider: 'google_sheets', operation: 'read_metadata', spreadsheetId: data.spreadsheetId, title: data.title, spreadsheetUrl: data.spreadsheetUrl, sheets: data.sheets };
      }
      case 'read_google_sheet_range': {
        const data = await readSheetValues(String(safeArgs.spreadsheetId || '').trim(), String(safeArgs.range || '').trim(), token);
        return { success: true, provider: 'google_sheets', operation: 'read_range', spreadsheetId: String(safeArgs.spreadsheetId || '').trim(), range: data.range, values: data.values };
      }
      case 'write_google_sheet_range': {
        const data = await writeSheetValues(String(safeArgs.spreadsheetId || '').trim(), String(safeArgs.range || '').trim(), Array.isArray(safeArgs.values) ? safeArgs.values : [], token);
        return { success: true, provider: 'google_sheets', operation: 'write_range', spreadsheetId: String(safeArgs.spreadsheetId || '').trim(), range: data.updatedRange, updatedCells: data.updatedCells, updatedRows: data.updatedRows };
      }
      case 'append_google_sheet_row': {
        const data = await appendSheetRow(String(safeArgs.spreadsheetId || '').trim(), String(safeArgs.range || 'A1').trim(), Array.isArray(safeArgs.rows) ? safeArgs.rows : [], token);
        return { success: true, provider: 'google_sheets', operation: 'append_rows', spreadsheetId: String(safeArgs.spreadsheetId || '').trim(), updatedRange: data.updatedRange, updatedRows: data.updatedRows };
      }
      case 'batch_update_google_sheet': {
        const data = await batchUpdateGoogleSheet(String(safeArgs.spreadsheetId || '').trim(), Array.isArray(safeArgs.requests) ? safeArgs.requests : [], token);
        return { success: true, provider: 'google_sheets', operation: 'batch_update', spreadsheetId: String(safeArgs.spreadsheetId || '').trim(), replies: data.replies };
      }
      case 'create_google_keep_note': {
        const data = await createGoogleKeepNote(String(safeArgs.title || 'Untitled Note').slice(0, 999), String(safeArgs.content || '').slice(0, 19999), token);
        return { success: true, provider: 'google_keep', operation: 'create', noteName: data.name, title: data.title, content: data.content, updateTime: data.updateTime };
      }
      case 'list_google_keep_notes': {
        const data = await listGoogleKeepNotes(Math.max(1, Math.min(Number(safeArgs.pageSize || 20), 100)), token);
        return { success: true, provider: 'google_keep', operation: 'list', notes: data.notes.map((n) => ({ noteName: n.name, title: n.title, content: n.content, updateTime: n.updateTime, trashed: n.trashed })), nextPageToken: data.nextPageToken };
      }
      case 'read_google_keep_note': {
        const data = await getGoogleKeepNote(String(safeArgs.noteName || '').trim(), token);
        return { success: true, provider: 'google_keep', operation: 'read', noteName: data.name, title: data.title, content: data.content, updateTime: data.updateTime, trashed: data.trashed };
      }
      case 'delete_google_keep_note': {
        const cleanName = String(safeArgs.noteName || '').trim();
        await deleteGoogleKeepNote(cleanName, token);
        return { success: true, provider: 'google_keep', operation: 'delete', noteName: cleanName.startsWith('notes/') ? cleanName : `notes/${cleanName}` };
      }
      default:
        return { success: false, provider: 'google', errorCode: 'GOOGLE_UNKNOWN_ERROR', message: `Unknown Google agent tool: ${toolName}` };
    }
  } catch (error: any) {
    const provider = toolName.includes('keep') ? 'google_keep' : 'google_sheets';
    return { success: false, provider, errorCode: 'GOOGLE_UNKNOWN_ERROR', message: String(error?.message || error || 'Google operation failed') };
  }
}

"""
          text = text[:start] + replacement + text[text.index('async function writeSheetValues', start):]
          # Drop the old helper after the newly inserted delegating execution function.
          old_helper = text.find('async function writeSheetValues', start)
          if old_helper >= 0: text = text[:old_helper]
          agent.write_text("import { createGoogleSheet, getSpreadsheetDetails, readSheetValues, appendSheetRow, writeSheetValues, batchUpdateGoogleSheet } from '../services/googleSheetsService';\nimport { createGoogleKeepNote, listGoogleKeepNotes, getGoogleKeepNote, deleteGoogleKeepNote } from '../services/googleKeepService';\n\n" + text)
          PY
          npm install --no-audit --no-fund
          npm run lint
          npx tsc --noEmit
          npm test -- --runInBand
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/googleSheetsService.ts src/lib/googleAgentTools.ts
          git commit -m 'refactor(tools): delegate Google Sheet and Keep tools to canonical services [pass59]'
          git push origin HEAD:$BRANCH
          rm -f .github/workflows/pass59-google-tool-delegation.yml
          git add -u .github/workflows/pass59-google-tool-delegation.yml
          git commit -m 'chore(pass59): remove temporary tool delegation runner' || true
          git push origin HEAD:$BRANCH
