name: Pass 6 settings extraction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.ELARA_MIRROR_TOKEN }}
          fetch-depth: 0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Extract settings controller
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          app = Path('src/App.tsx')
          text = app.read_text()

          import_anchor = "import { useWorkspaceController } from './features/workspace/useWorkspaceController';\n"
          import_line = "import { useSettingsController } from './features/settings/useSettingsController';\n"
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          theme_state = "  const [theme, setTheme] = useState<'dark' | 'light'>(settings.theme || 'dark');\n\n"
          theme_state_anchor = "  const { activeArtifactId, handleOpenArtifact, handleSelectArtifact, handleBackToChat } = useWorkspaceController({\n    setCurrentView,\n  });\n"
          if theme_state not in text or theme_state_anchor not in text:
              raise SystemExit('Pass 6 state/controller markers not found')

          text = text.replace(theme_state, '', 1)
          text = text.replace(theme_state_anchor, theme_state_anchor + "\n  const { theme, handleSaveSettings, handleToggleTheme } = useSettingsController({\n    settings,\n    setSettings,\n  });\n\n", 1)

          effect = "  // Initialize theme class\n  useEffect(() => {\n    if (theme === 'light') {\n      document.documentElement.classList.remove('dark');\n    } else {\n      document.documentElement.classList.add('dark');\n    }\n  }, [theme]);\n\n"
          save_block = "  // Save Settings\n  const handleSaveSettings = (newSettings: ElaraSettings) => {\n    setSettings(newSettings);\n    setTheme(newSettings.theme);\n    setDbSettings(newSettings);\n  };\n\n"
          toggle_block = "  // Toggle Theme\n  const handleToggleTheme = () => {\n    const nextTheme: 'dark' | 'light' = theme === 'dark' ? 'light' : 'dark';\n    setTheme(nextTheme);\n    const updatedSettings: ElaraSettings = { ...settings, theme: nextTheme };\n    setSettings(updatedSettings);\n    setDbSettings(updatedSettings);\n  };\n\n"
          for block, name in ((effect, 'theme effect'), (save_block, 'save settings'), (toggle_block, 'toggle theme')):
              if block not in text:
                  raise SystemExit(f'Pass 6 {name} block not found')
              text = text.replace(block, '', 1)

          controller = Path('src/features/settings/useSettingsController.ts')
          controller.parent.mkdir(parents=True, exist_ok=True)
          controller.write_text("""import { useEffect, useState, type Dispatch, type SetStateAction } from 'react';\nimport type { ElaraSettings } from '../../types';\nimport { setDbSettings } from '../../lib/db';\n\nexport type SettingsControllerArgs = {\n  settings: ElaraSettings;\n  setSettings: Dispatch<SetStateAction<ElaraSettings>>;\n};\n\nexport function useSettingsController({ settings, setSettings }: SettingsControllerArgs) {\n  const [theme, setTheme] = useState<'dark' | 'light'>(settings.theme || 'dark');\n\n  useEffect(() => {\n    if (theme === 'light') document.documentElement.classList.remove('dark');\n    else document.documentElement.classList.add('dark');\n  }, [theme]);\n\n  const handleSaveSettings = (newSettings: ElaraSettings) => {\n    setSettings(newSettings);\n    setTheme(newSettings.theme);\n    setDbSettings(newSettings);\n  };\n\n  const handleToggleTheme = () => {\n    const nextTheme: 'dark' | 'light' = theme === 'dark' ? 'light' : 'dark';\n    setTheme(nextTheme);\n    const updatedSettings: ElaraSettings = { ...settings, theme: nextTheme };\n    setSettings(updatedSettings);\n    setDbSettings(updatedSettings);\n  };\n\n  return { theme, handleSaveSettings, handleToggleTheme };\n}\n""")
          app.write_text(text)
          PY

      - name: Structural verification
        run: |
          set -euo pipefail
          test -f src/features/settings/useSettingsController.ts
          grep -q "useSettingsController" src/App.tsx
          ! grep -q "const \[theme, setTheme\]" src/App.tsx
          ! grep -q "// Initialize theme class" src/App.tsx
          ! grep -q "const handleSaveSettings" src/App.tsx
          ! grep -q "const handleToggleTheme" src/App.tsx

      - name: Typecheck baseline only
        continue-on-error: true
        run: npm exec tsc -- --noEmit

      - name: Push Pass 6 branch
        env:
          TOKEN: ${{ secrets.ELARA_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Elara Architecture Bot'
          git config user.email 'elara-architecture@users.noreply.github.com'
          git switch -C refactor/pass6-settings
          git add src/App.tsx src/features/settings/useSettingsController.ts
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: Pass 6 extract settings controller'
          git push --force https://x-access-token:${TOKEN}@github.com/cryogenized-spec/Elara-Companion.git HEAD:refactor/pass6-settings
