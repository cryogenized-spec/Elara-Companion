name: Pass 64 facade inversion
on:
  push:
    branches:
      - refactor/pass64-google-facade-inversion
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Invert legacy Google consumers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('src/components/SettingsModal.tsx')
          s = settings.read_text()
          s = s.replace("} from '../lib/googleApi';", "} from '../services/settingsGoogleService';", 1)
          settings.write_text(s)

          tools = Path('src/lib/workspaceTools.ts')
          s = tools.read_text()
          old = "  createKeepNote,\n  getKeepNote,\n  updateKeepNote,\n  isGoogleConnected,\n} from './googleApi';"
          new = "  isGoogleConnected,\n} from './googleApi';\nimport { createKeepNote, getKeepNote, updateKeepNote } from '../legacy/googleKeepArchive';"
          if old not in s:
              raise SystemExit('workspaceTools Keep import pattern not found')
          s = s.replace(old, new, 1)
          tools.write_text(s)
          PY
          
          if grep -R "from '../lib/googleApi'" -n src/components src/services src/lib/workspaceTools.ts; then
            echo 'Legacy Google façade consumer imports remain in feature code'; exit 1
          fi
          
          git config user.name 'Elara Architecture Bot'
          git config user.email 'architecture@users.noreply.github.com'
          git add src/components/SettingsModal.tsx src/lib/workspaceTools.ts
          git diff --cached --check
          git commit -m 'refactor(architecture): invert remaining Google façade consumers'
          git push
