name: Pass 68 settings boundary

on:
  push:
    branches:
      - refactor/pass64-google-facade-inversion

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
      - name: Migrate Settings and legacy archive consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('src/components/SettingsModal.tsx')
          s = settings.read_text()
          s = s.replace("import { getDbSnapshots, setDbSnapshots } from '../lib/db';", "import { settingsPersistence } from '../services/settingsPersistenceService';", 1)
          s = s.replace('getDbSnapshots().then(setSnapshots);', 'settingsPersistence.loadPersonaSnapshots().then(setSnapshots);', 1)
          s = s.replace('await setDbSnapshots(updated);', 'await settingsPersistence.savePersonaSnapshots(updated);', 2)
          settings.write_text(s)

          google = Path('src/services/settingsGoogleService.ts')
          s = google.read_text()
          s = s.replace("export { createKeepNote, searchKeepNotes, listKeepNotes, getKeepNote, updateKeepNote, deleteKeepNote } from '../legacy/googleKeepArchive';\nexport type { KeepNoteItem } from '../legacy/googleKeepArchive';", "export { createReferenceNote as createKeepNote, searchReferenceNotes as searchKeepNotes, listReferenceNotes as listKeepNotes, getReferenceNote as getKeepNote, updateReferenceNote as updateKeepNote, deleteReferenceNote as deleteKeepNote } from './referenceArchiveService';\nexport type { ReferenceNoteItem as KeepNoteItem } from './referenceArchiveService';", 1)
          google.write_text(s)

          tools = Path('src/lib/workspaceTools.ts')
          s = tools.read_text()
          s = s.replace("import { createKeepNote, getKeepNote, updateKeepNote } from '../legacy/googleKeepArchive';", "import { createReferenceNote as createKeepNote, getReferenceNote as getKeepNote, updateReferenceNote as updateKeepNote } from '../services/referenceArchiveService';", 1)
          tools.write_text(s)
          PY

          grep -R "legacy/googleKeepArchive" -n src --include='*.ts' --include='*.tsx' && exit 1 || true
          grep -R "getDbSnapshots\|setDbSnapshots" -n src/components --include='*.ts' --include='*.tsx' && exit 1 || true
          git diff --check
          git config user.name 'Elara Architecture Bot'
          git config user.email 'architecture@users.noreply.github.com'
          git add src/components/SettingsModal.tsx src/services/settingsGoogleService.ts src/lib/workspaceTools.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(architecture): close remaining settings and archive boundaries'
          git push
