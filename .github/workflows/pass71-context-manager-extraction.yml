name: Pass 71 Context Manager Extraction

on:
  push:
    paths:
      - '.context-manager-extraction.trigger'
      - '.github/workflows/pass71-context-manager-extraction.yml'

permissions:
  contents: write

jobs:
  extract:
    if: ${{ hashFiles('.context-manager-extraction.trigger') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Redirect consumers and remove legacy manager
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              "from '../lib/contextManager'": "from '../services/chatContextService'",
              'from "../lib/contextManager"': 'from "../services/chatContextService"',
              "from '../../lib/contextManager'": "from '../../services/chatContextService'",
              'from "../../lib/contextManager"': 'from "../../services/chatContextService"',
              "from './contextManager'": "from '../services/chatContextService'",
              'from "./contextManager"': 'from "../services/chatContextService"',
              "from '../contextManager'": "from '../../services/chatContextService'",
              'from "../contextManager"': 'from "../../services/chatContextService"',
          }
          roots = [Path('src')]
          changed = []
          for root in roots:
              for path in root.rglob('*.ts'):
                  text = path.read_text()
                  new = text
                  for old, replacement in replacements.items():
                      new = new.replace(old, replacement)
                  if new != text:
                      path.write_text(new)
                      changed.append(str(path))
              for path in root.rglob('*.tsx'):
                  text = path.read_text()
                  new = text
                  for old, replacement in replacements.items():
                      new = new.replace(old, replacement)
                  if new != text:
                      path.write_text(new)
                      changed.append(str(path))
          print('redirected:', *changed, sep='\n- ')
          PY

          test ! -e src/legacy/googleKeepArchive.ts
          rm src/lib/contextManager.ts
          rm .context-manager-extraction.trigger
          rm .github/workflows/pass71-context-manager-extraction.yml

          if grep -R "contextManager" src --include='*.ts' --include='*.tsx' >/tmp/context-manager-leftovers.txt; then
            echo 'Unexpected source references remain:'
            cat /tmp/context-manager-leftovers.txt
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .context-manager-extraction.trigger .github/workflows/pass71-context-manager-extraction.yml
          git commit -m 'refactor(context): remove legacy context manager'
          git push
