name: Pass 75 legacy cut

on:
  push:
    branches: [refactor/**]
    paths: [docs/PASS75_TRIGGER.md]

permissions:
  contents: write

concurrency:
  group: pass75-legacy-cut-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cut:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cut legacy workspace imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/workspaceTools.ts')
          text = path.read_text()

          old_google = """import {\n  createGoogleDoc,\n  getGoogleDoc,\n  editGoogleDoc,\n  listGoogleDriveFiles,\n  searchGoogleDriveFiles,\n  readGoogleDriveFile,\n  isGoogleConnected,\n} from './googleApi';\nimport { createKeepNote, getKeepNote, updateKeepNote } from '../legacy/googleKeepArchive';\n"""

          new_google = """import {\n  createGoogleDoc,\n  getGoogleDoc,\n  editGoogleDoc,\n  listGoogleDriveFiles,\n  searchGoogleDriveFiles,\n  readGoogleDriveFile,\n} from '../services/googleDocsDriveService';\nimport { googleIdentity } from '../services/googleWorkspaceService';\nimport { createKeepNote, getKeepNote, updateKeepNote } from '../services/referenceArchiveService';\n"""

          if old_google not in text:
              raise SystemExit('Expected legacy Workspace/Google import block not found; refusing mutation.')
          if "../legacy/googleKeepArchive" not in text and "from './googleApi'" not in text:
              raise SystemExit('Legacy imports already absent; refusing to create a misleading migration commit.')

          text = text.replace(old_google, new_google, 1)
          text = text.replace('isGoogleConnected()', 'googleIdentity.isAuthorized()', 1)
          path.write_text(text)
          PY

          rm src/legacy/googleKeepArchive.ts

          cat > docs/PASS74_LEGACY_CENSUS.md <<'EOF'
          # Pass 74 — Legacy census and deletion map

          The post-Programme-2 census identified one remaining production source dependency on the legacy Keep compatibility path and one remaining production source dependency on the Google compatibility façade.

          `src/lib/workspaceTools.ts` previously imported Google Docs/Drive operations from `src/lib/googleApi.ts` and local reference-archive operations from `src/legacy/googleKeepArchive.ts`. The Google operations now use the canonical Google service modules, and the archive operations use `src/services/referenceArchiveService.ts` directly.

          The compatibility Keep shim has therefore been physically deleted. The historical local archive storage key remains owned by `referenceArchiveService` so existing data is not silently orphaned.

          The legacy Google façade remains in `src/lib/googleApi.ts` only for compatibility exports used elsewhere; its OAuth authority was removed in Pass 66. It is a later deletion candidate only where a repository-wide consumer census proves no external or internal compatibility imports remain.
          EOF

          rm docs/PASS75_TRIGGER.md
          rm .github/workflows/pass75-legacy-cut.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/workspaceTools.ts src/legacy/googleKeepArchive.ts docs/PASS74_LEGACY_CENSUS.md docs/PASS75_TRIGGER.md .github/workflows/pass75-legacy-cut.yml
          git commit -m 'refactor(legacy): remove Workspace dependency on legacy Google facades'
          git push
