name: Pass 8 application shell extraction

on:
  push:
    branches: [refactor/pass8-application-shell]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pass8-application-shell
          token: ${{ secrets.ELARA_MIRROR_TOKEN }}
          fetch-depth: 0

      - name: Extract application shell
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          # Add controller imports.
          anchors = [
              ("import { useSettingsController } from './features/settings/useSettingsController';\n",
               "import { useApplicationStateController } from './app/useApplicationStateController';\nimport { useChatCommandController } from './features/chat/useChatCommandController';\n"),
          ]
          for anchor, insert in anchors:
              if insert not in text:
                  if anchor not in text:
                      raise SystemExit('Pass 8 import anchor not found')
                  text = text.replace(anchor, anchor + insert, 1)

          # Replace state declarations + bootstrap effect with application controller.
          old_state = """  const [isLoaded, setIsLoaded] = useState(false);\n  const [conversations, setConversations] = useState<Conversation[]>([]);\n  const [folders, setFolders] = useState<Folder[]>([]);\n  const [activeId, setActiveId] = useState<string | null>(null);\n  const [settings, setSettings] = useState<ElaraSettings>(DEFAULT_SETTINGS);\n  const [worldState, setWorldState] = useState<WorldState>(DEFAULT_WORLD_STATE);\n  const [memoryState, setMemoryState] = useState<MemoryScratchpadState>(DEFAULT_MEMORY_STATE);\n  const [customPortrait, setCustomPortrait] = useState<string | null>(null);\n\n  useBackgroundRuntimeController({\n    isLoaded,\n    setConversations,\n  });\n\n  useEffect(() => {\n    migrateFromLocalStorage().then(async () => {\n      setFolders(await getDbFolders());\n      setSettings(await getDbSettings());\n      setWorldState(await getDbWorldState());\n      setMemoryState(await getDbMemoryState());\n      setCustomPortrait(await getDbPortrait());\n      \n      const loadedConvs = await getDbConversations();\n      if (loadedConvs.length > 0) {\n        setConversations(loadedConvs);\n        setActiveId(loadedConvs[0].id);\n      } else {\n        const initialConv: Conversation = {\n          id: generateUniqueId('conv'),\n          title: 'New Conversation',\n          messages: [],\n          createdAt: Date.now(),\n          updatedAt: Date.now(),\n        };\n        setConversations([initialConv]);\n        setActiveId(initialConv.id);\n      }\n      setIsLoaded(true);\n    });\n  }, []);\n"""
          new_state = """  const {\n    isLoaded,\n    conversations,\n    folders,\n    activeId,\n    settings,\n    worldState,\n    memoryState,\n    customPortrait,\n    setConversations,\n    setFolders,\n    setActiveId,\n    setSettings,\n    setWorldState,\n    setMemoryState,\n    setCustomPortrait,\n  } = useApplicationStateController();\n\n  useBackgroundRuntimeController({ isLoaded, setConversations });\n"""
          if old_state not in text:
              raise SystemExit('Pass 8 bootstrap state block not found')
          text = text.replace(old_state, new_state, 1)

          # Remove shell-level persistence effects now owned by app controller.
          persistence = """  // Save data whenever it changes\n  useEffect(() => { if (isLoaded) setDbConversations(conversations); }, [conversations, isLoaded]);\n  useEffect(() => { if (isLoaded) setDbFolders(folders); }, [folders, isLoaded]);\n  useEffect(() => { if (isLoaded) setDbSettings(settings); }, [settings, isLoaded]);\n  useEffect(() => { if (isLoaded) setDbWorldState(worldState); }, [worldState, isLoaded]);\n  useEffect(() => { if (isLoaded) setDbMemoryState(memoryState); }, [memoryState, isLoaded]);\n  useEffect(() => { if (isLoaded) setDbPortrait(customPortrait); }, [customPortrait, isLoaded]);\n\n"""
          if persistence not in text:
              raise SystemExit('Pass 8 persistence block not found')
          text = text.replace(persistence, '', 1)

          # Extract remaining chat command orchestration.
          cmd_start = text.find('  // Stop Streaming\n')
          cmd_end = text.find('  const {\n    handleNewConversation,', cmd_start)
          if cmd_start < 0 or cmd_end < 0:
              raise SystemExit('Pass 8 chat command region not found')
          command_region = text[cmd_start:cmd_end]
          if 'const handleSendMessage' not in command_region or 'const handleRegenerate' not in command_region:
              raise SystemExit('Pass 8 chat command symbols missing')

          controller_hooks = """  const {\n    streamAssistantResponse,\n    generateConversationTitle,\n  } = useChatStreamController({\n    conversations,\n    settings,\n    memoryState,\n    setConversations,\n    setMemoryState,\n    setIsStreaming,\n    abortControllerRef,\n    userHasScrolledUpRef,\n  });\n\n  const {\n    handleStopStreaming,\n    handleSendMessage,\n    handleRegenerate,\n    handleEditAndResend,\n    handleCompleteResponse,\n    handleRetry,\n  } = useChatCommandController({\n    conversations,\n    activeConversation,\n    activeId,\n    settings,\n    memoryState,\n    isStreaming,\n    setConversations,\n    setActiveId,\n    setIsStreaming,\n    streamAssistantResponse,\n    abortControllerRef,\n  });\n\n"""
          # Keep refs/scroll logic, but hook command region comes after activeConversation.
          text = text[:cmd_start] + controller_hooks + text[cmd_end:]

          # Correct conversation controller boundary: settings import is delegated to settings controller.
          text = text.replace(
              "    setSettings,\n    setTheme,\n",
              "",
              1,
          )
          text = text.replace(
              "  } = useConversationController({\n    conversations,\n    folders,\n    settings,\n    activeId,\n    isStreaming,\n    setConversations,\n    setFolders,\n    setActiveId,\n",
              "  } = useConversationController({\n    conversations,\n    folders,\n    settings,\n    activeId,\n    isStreaming,\n    setConversations,\n    setFolders,\n    setActiveId,\n",
              1,
          )
          text = text.replace(
              "    stopStreaming: handleStopStreaming,\n    userHasScrolledUpRef,\n  });",
              "    applyImportedSettings: handleSaveSettings,\n    stopStreaming: handleStopStreaming,\n    userHasScrolledUpRef,\n  });",
              1,
          )

          # Remove no-longer-used hook parameter/state imports from App where safe.
          text = text.replace("import { CanvasData, Conversation, Message, ElaraSettings, WorldState, MemoryScratchpadState, Folder } from './types';\n",
                              "import { CanvasData } from './types';\n")
          text = text.replace("import { DEFAULT_WORLD_STATE } from './constants/defaultWorldState';\n", "")
          text = text.replace("import { resetMemoryState, exportMemoryJSON, importMemoryJSON, DEFAULT_MEMORY_STATE } from './lib/memoryStorage';\n",
                              "import { resetMemoryState, exportMemoryJSON, importMemoryJSON } from './lib/memoryStorage';\n")
          text = text.replace("import { exportAllDataJSON, exportConversationMarkdown, importDataJSON, incrementRateLimit, DEFAULT_SETTINGS, generateUniqueId } from './lib/storage';\n",
                              "import { exportConversationMarkdown, incrementRateLimit } from './lib/storage';\n")
          text = text.replace("  getDbConversations, setDbConversations,\n  getDbSettings, setDbSettings,\n  getDbFolders, setDbFolders,\n  getDbPortrait, setDbPortrait,\n  getDbWorldState, setDbWorldState,\n  getDbMemoryState, setDbMemoryState,\n  clearDbStorage, migrateFromLocalStorage\n",
                              "  setDbPortrait\n")
          text = text.replace("import { loadUserProfileNotes, loadActiveScratchpad, buildSystemPayload } from './lib/contextManager';\n", "")
          text = text.replace("import { getAccessToken } from './lib/googleApi';\n", "")
          text = text.replace("import { getActiveThoughtSentence, parseThoughtSteps, extractThoughtsAndContent } from './utils/thoughtUtils';\n", "")
          text = text.replace("import { extractCanvases } from './utils/canvasUtils';\n", "")
          text = text.replace("import { runDirectGeminiStream, runDirectMemoryExtraction, runDirectTitleGeneration } from './lib/geminiDirectClient';\n", "")
          text = text.replace("import { applyMemoryActions } from './lib/memoryProcessor';\n", "")
          text = text.replace("import { createStreamUiScheduler } from './lib/streamUiScheduler';\n", "")

          app.write_text(text)

          # New application-state controller.
          app_ctrl = Path('src/app/useApplicationStateController.ts')
          app_ctrl.parent.mkdir(parents=True, exist_ok=True)
          app_ctrl.write_text("""import { useEffect, useState, type Dispatch, type SetStateAction } from 'react';\nimport type { Conversation, ElaraSettings, Folder, MemoryScratchpadState, WorldState } from '../types';\nimport { DEFAULT_SETTINGS, generateUniqueId } from '../lib/storage';\nimport { DEFAULT_WORLD_STATE } from '../constants/defaultWorldState';\nimport { DEFAULT_MEMORY_STATE } from '../lib/memoryStorage';\nimport { migrateFromLocalStorage, getDbConversations, getDbFolders, getDbSettings, getDbWorldState, getDbMemoryState, getDbPortrait, setDbConversations, setDbFolders, setDbSettings, setDbWorldState, setDbMemoryState, setDbPortrait } from '../lib/db';\n\nexport type ApplicationState = {\n  isLoaded: boolean;\n  conversations: Conversation[];\n  folders: Folder[];\n  activeId: string | null;\n  settings: ElaraSettings;\n  worldState: WorldState;\n  memoryState: MemoryScratchpadState;\n  customPortrait: string | null;\n  setConversations: Dispatch<SetStateAction<Conversation[]>>;\n  setFolders: Dispatch<SetStateAction<Folder[]>>;\n  setActiveId: Dispatch<SetStateAction<string | null>>;\n  setSettings: Dispatch<SetStateAction<ElaraSettings>>;\n  setWorldState: Dispatch<SetStateAction<WorldState>>;\n  setMemoryState: Dispatch<SetStateAction<MemoryScratchpadState>>;\n  setCustomPortrait: Dispatch<SetStateAction<string | null>>;\n};\n\nexport function useApplicationStateController(): ApplicationState {\n  const [isLoaded, setIsLoaded] = useState(false);\n  const [conversations, setConversations] = useState<Conversation[]>([]);\n  const [folders, setFolders] = useState<Folder[]>([]);\n  const [activeId, setActiveId] = useState<string | null>(null);\n  const [settings, setSettings] = useState<ElaraSettings>(DEFAULT_SETTINGS);\n  const [worldState, setWorldState] = useState<WorldState>(DEFAULT_WORLD_STATE);\n  const [memoryState, setMemoryState] = useState<MemoryScratchpadState>(DEFAULT_MEMORY_STATE);\n  const [customPortrait, setCustomPortrait] = useState<string | null>(null);\n\n  useEffect(() => {\n    void migrateFromLocalStorage().then(async () => {\n      setFolders(await getDbFolders());\n      setSettings(await getDbSettings());\n      setWorldState(await getDbWorldState());\n      setMemoryState(await getDbMemoryState());\n      setCustomPortrait(await getDbPortrait());\n      const loadedConvs = await getDbConversations();\n      if (loadedConvs.length > 0) {\n        setConversations(loadedConvs);\n        setActiveId(loadedConvs[0].id);\n      } else {\n        const initialConv: Conversation = { id: generateUniqueId('conv'), title: 'New Conversation', messages: [], createdAt: Date.now(), updatedAt: Date.now() };\n        setConversations([initialConv]);\n        setActiveId(initialConv.id);\n      }\n      setIsLoaded(true);\n    });\n  }, []);\n\n  useEffect(() => { if (isLoaded) void setDbConversations(conversations); }, [conversations, isLoaded]);\n  useEffect(() => { if (isLoaded) void setDbFolders(folders); }, [folders, isLoaded]);\n  useEffect(() => { if (isLoaded) void setDbSettings(settings); }, [settings, isLoaded]);\n  useEffect(() => { if (isLoaded) void setDbWorldState(worldState); }, [worldState, isLoaded]);\n  useEffect(() => { if (isLoaded) void setDbMemoryState(memoryState); }, [memoryState, isLoaded]);\n  useEffect(() => { if (isLoaded) void setDbPortrait(customPortrait); }, [customPortrait, isLoaded]);\n\n  return { isLoaded, conversations, folders, activeId, settings, worldState, memoryState, customPortrait, setConversations, setFolders, setActiveId, setSettings, setWorldState, setMemoryState, setCustomPortrait };\n}\n""")

          # New chat-command controller.
          cmd = Path('src/features/chat/useChatCommandController.ts')
          cmd.parent.mkdir(parents=True, exist_ok=True)
          cmd.write_text("""import type { MutableRefObject, Dispatch, SetStateAction } from 'react';\nimport type { Conversation, ElaraSettings, MemoryScratchpadState, Message } from '../../types';\nimport { generateUniqueId } from '../../lib/storage';\n\nexport type ChatCommandControllerArgs = {\n  conversations: Conversation[];\n  activeConversation: Conversation | null;\n  activeId: string | null;\n  settings: ElaraSettings;\n  memoryState: MemoryScratchpadState;\n  isStreaming: boolean;\n  setConversations: Dispatch<SetStateAction<Conversation[]>>;\n  setActiveId: Dispatch<SetStateAction<string | null>>;\n  setIsStreaming: Dispatch<SetStateAction<boolean>>;\n  streamAssistantResponse: (conversationId: string, text: string, history: Message[], image?: string) => void;\n  abortControllerRef: MutableRefObject<AbortController | null>;\n};\n\nexport function useChatCommandController({ conversations, activeConversation, activeId, settings, memoryState, isStreaming, setConversations, setActiveId, setIsStreaming, streamAssistantResponse, abortControllerRef }: ChatCommandControllerArgs) {\n  const handleStopStreaming = () => {\n    if (abortControllerRef.current) {\n      abortControllerRef.current.abort();\n      abortControllerRef.current = null;\n    }\n    setIsStreaming(false);\n    if (activeId) {\n      setConversations((prev) => prev.map((c) => c.id === activeId ? { ...c, messages: c.messages.map((m) => m.isStreaming ? { ...m, isStreaming: false } : m) } : c));\n    }\n  };\n\n  const handleSendMessage = (text: string, image?: string) => {\n    let currentConvId = activeId;\n    if (!currentConvId) {\n      const newConv: Conversation = { id: generateUniqueId('conv'), title: text.slice(0, 30) || (image ? 'Image Attachment' : 'New Conversation'), createdAt: Date.now(), updatedAt: Date.now(), messages: [] };\n      setConversations([newConv]);\n      setActiveId(newConv.id);\n      currentConvId = newConv.id;\n    }\n    const conv = conversations.find((c) => c.id === currentConvId);\n    const existingMessages = conv ? conv.messages : [];\n    const userMsg: Message = { id: generateUniqueId('msg_usr'), role: 'user', content: text, image, timestamp: Date.now() };\n    setConversations((prev) => prev.map((c) => c.id === currentConvId ? { ...c, updatedAt: Date.now(), messages: [...c.messages, userMsg] } : c));\n    streamAssistantResponse(currentConvId, text, existingMessages, image);\n  };\n\n  const handleRegenerate = () => {\n    if (!activeConversation || isStreaming) return;\n    const msgs = activeConversation.messages;\n    let lastUserIndex = -1;\n    for (let i = msgs.length - 1; i >= 0; i--) { if (msgs[i].role === 'user') { lastUserIndex = i; break; } }\n    if (lastUserIndex === -1) return;\n    const lastUserMsg = msgs[lastUserIndex];\n    const historyMsgs = msgs.slice(0, lastUserIndex);\n    const trimmedMsgs = msgs.slice(0, lastUserIndex + 1);\n    setConversations((prev) => prev.map((c) => c.id === activeConversation.id ? { ...c, messages: trimmedMsgs } : c));\n    streamAssistantResponse(activeConversation.id, lastUserMsg.content, historyMsgs, lastUserMsg.image);\n  };\n\n  const handleEditAndResend = (messageId: string, newContent: string) => {\n    if (!activeConversation || isStreaming) return;\n    const msgs = activeConversation.messages;\n    const targetIndex = msgs.findIndex((m) => m.id === messageId);\n    if (targetIndex === -1) return;\n    const historyMsgs = msgs.slice(0, targetIndex);\n    const targetMsg = msgs[targetIndex];\n    const updatedUserMsg: Message = { ...targetMsg, content: newContent, timestamp: Date.now() };\n    const trimmedMsgs = [...historyMsgs, updatedUserMsg];\n    setConversations((prev) => prev.map((c) => c.id === activeConversation.id ? { ...c, messages: trimmedMsgs } : c));\n    streamAssistantResponse(activeConversation.id, newContent, historyMsgs, targetMsg.image);\n  };\n\n  const handleCompleteResponse = () => {\n    if (!activeConversation || isStreaming) return;\n    handleSendMessage(\"Please continue and complete your last response right from where you left off, without repeating what you've already written.\");\n  };\n\n  const handleRetry = () => { handleRegenerate(); };\n\n  return { handleStopStreaming, handleSendMessage, handleRegenerate, handleEditAndResend, handleCompleteResponse, handleRetry };\n}\n""")
          PY

      - name: Fix conversation settings boundary
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/features/conversations/useConversationController.ts')
          text = p.read_text()
          text = text.replace("  setSettings: Dispatch<SetStateAction<ElaraSettings>>;\n  setTheme: Dispatch<SetStateAction<'dark' | 'light'>>;\n", "  applyImportedSettings: (nextSettings: ElaraSettings) => void;\n")
          text = text.replace("  setConversations, setFolders, setActiveId, setSettings, setTheme,\n", "  setConversations, setFolders, setActiveId, applyImportedSettings,\n")
          text = text.replace("      setSettings(mergedSettings); setTheme(mergedSettings.theme); setDbSettings(mergedSettings);\n", "      applyImportedSettings(mergedSettings);\n")
          text = text.replace("  }, [setActiveId, setConversations, setSettings, setTheme, settings]);\n", "  }, [applyImportedSettings, setActiveId, setConversations, settings]);\n")
          p.write_text(text)
          PY

      - name: Structural verification
        run: |
          set -euo pipefail
          test -f src/app/useApplicationStateController.ts
          test -f src/features/chat/useChatCommandController.ts
          grep -q "useApplicationStateController" src/App.tsx
          grep -q "useChatCommandController" src/App.tsx
          ! grep -q "migrateFromLocalStorage" src/App.tsx
          ! grep -q "const handleSendMessage" src/App.tsx
          ! grep -q "const handleRegenerate" src/App.tsx
          ! grep -q "const handleEditAndResend" src/App.tsx
          ! grep -q "const handleCompleteResponse" src/App.tsx
          ! grep -q "const handleRetry" src/App.tsx
          ! grep -q "const handleStopStreaming" src/App.tsx
          ! grep -q "setTheme" src/features/conversations/useConversationController.ts

      - name: Typecheck baseline only
        continue-on-error: true
        run: npm exec tsc -- --noEmit

      - name: Commit extraction
        env:
          TOKEN: ${{ secrets.ELARA_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Elara Architecture Bot'
          git config user.email 'elara-architecture@users.noreply.github.com'
          git add src/App.tsx src/app/useApplicationStateController.ts src/features/chat/useChatCommandController.ts src/features/conversations/useConversationController.ts .github/workflows/pass8-branch-extract.yml
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: collapse App orchestration into application shell'
          git push https://x-access-token:${TOKEN}@github.com/cryogenized-spec/Elara-Companion.git HEAD:refactor/pass8-application-shell
