name: Restore Adult Fiction Files
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/adult-fiction-payload.json'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore files from payload
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const payload = JSON.parse(fs.readFileSync('scripts/adult-fiction-payload.json', 'utf8'));
          for (const [path, b64] of Object.entries(payload)) {
            const buf = zlib.gunzipSync(Buffer.from(b64, 'base64'));
            fs.mkdirSync(require('path').dirname(path), { recursive: true });
            fs.writeFileSync(path, buf);
            console.log('Wrote', path, buf.length);
          }
          NODE
      - name: Commit and push
        run: |
          git config user.name "Elara Restore Bot"
          git config user.email "noreply@github.com"
          git add src/App.tsx src/components/SettingsModal.tsx
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Restore App.tsx and SettingsModal with Adult Fiction module"
          git push
