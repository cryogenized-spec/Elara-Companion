name: Apply memory typecheck fix
on:
  push:
    branches: [fix/lockbox-environment-access]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch impossible action comparison
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/memoryProcessor.ts')
          text = p.read_text()
          old = "if (typeof window !== 'undefined' && action.type !== 'NO_ACTION') {"
          new = "if (typeof window !== 'undefined') {"
          if old not in text:
              raise SystemExit('Expected comparison not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/ts-memory-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/memoryProcessor.ts .github/workflows/ts-memory-fix.yml
          git diff --cached --check
          git commit -m 'fix: resolve memory processor type narrowing [skip ci]'
          git push origin HEAD:fix/lockbox-environment-access
