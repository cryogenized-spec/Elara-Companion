name: Wire durable chat path

on:
  push:
    paths:
      - '.github/workflows/wire-durable-chat.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Patch application
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          if "from './lib/backgroundChatClient'" not in text:
              text = text.replace(
                  "import { applyMemoryActions } from './lib/memoryProcessor';\n",
                  "import { applyMemoryActions } from './lib/memoryProcessor';\nimport { createBackgroundChatJob, isBackgroundRuntimeEnabled, loadPersistedBackgroundJobs, persistBackgroundJob, removePersistedBackgroundJob, waitForBackgroundChatJob } from './lib/backgroundChatClient';\nimport { notifyBackgroundCompletion } from './lib/backgroundService';\n"
              )

          marker = "  const [isStreaming, setIsStreaming] = useState(false);\n"
          if "loadPersistedBackgroundJobs" in text and "// Resume durable background jobs after page reload" not in text:
              resume = '''  // Resume durable background jobs after page reload\n  useEffect(() => {\n    if (!isLoaded) return;\n    let cancelled = false;\n    const resumeJobs = async () => {\n      const jobs = loadPersistedBackgroundJobs();\n      for (const job of jobs) {\n        try {\n          const status = await waitForBackgroundChatJob(job.jobId);\n          if (cancelled) return;\n          if (['complete', 'completed'].includes(status.status)) {\n            const text = status.output?.result?.text || '';\n            setConversations((prev) => prev.map((c) => c.id !== job.conversationId ? c : ({\n              ...c,\n              updatedAt: Date.now(),\n              messages: c.messages.map((m) => m.id === job.assistantMessageId ? { ...m, content: text, isStreaming: false, isThinking: false, backgroundJobId: undefined } : m),\n            })));\n            removePersistedBackgroundJob(job.conversationId);\n            void notifyBackgroundCompletion('Elara finished', text.slice(0, 160) || 'Your background response is ready.');\n          } else if (['errored', 'failed', 'terminated'].includes(status.status)) {\n            setConversations((prev) => prev.map((c) => c.id !== job.conversationId ? c : ({\n              ...c,\n              messages: c.messages.map((m) => m.id === job.assistantMessageId ? { ...m, isStreaming: false, isThinking: false, isError: true, errorMessage: 'Background execution failed. Please retry.' , backgroundJobId: undefined } : m),\n            })));\n            removePersistedBackgroundJob(job.conversationId);\n          }\n        } catch (error) {\n          console.warn('Durable background job resume deferred:', error);\n        }\n      }\n    };\n    void resumeJobs();\n    return () => { cancelled = true; };\n  }, [isLoaded]);\n\n'''
              text = text.replace(marker, resume + marker)

          if "let durableJobAccepted = false;" not in text:
              text = text.replace(
                  "    let isDone = false;\n",
                  "    let isDone = false;\n    let durableJobAccepted = false;\n"
              )

          durable_branch = '''      // Optional durable server-side execution. Once accepted, never fall back to another Gemini call.\n      if (isBackgroundRuntimeEnabled()) {\n        const durableJob = await createBackgroundChatJob({\n          message: messageText,\n          image: attachedImage,\n          history: historyPayload.map((item) => ({ role: item.role === 'model' ? 'assistant' : 'user', content: item.content, image: item.image })),\n          systemPrompt: formattedSystemPrompt,\n          model: settings.model || 'gemini-3.7-flash',\n          temperature: settings.temperature,\n          maxOutputTokens: settings.maxOutputTokens,\n          topP: settings.topP,\n          topK: settings.topK,\n        });\n        durableJobAccepted = true;\n        persistBackgroundJob({ conversationId: targetConvId, assistantMessageId: assistantMsgId, jobId: durableJob.id, createdAt: Date.now() });\n        setConversations((prev) => prev.map((c) => c.id !== targetConvId ? c : ({\n          ...c,\n          messages: c.messages.map((m) => m.id === assistantMsgId ? { ...m, backgroundJobId: durableJob.id, currentThoughtSentence: 'Elara is working in the background…' } : m),\n        })));\n        const durableStatus = await waitForBackgroundChatJob(durableJob.id);\n        if (!['complete', 'completed'].includes(durableStatus.status)) {\n          throw new Error(durableStatus.error ? String(durableStatus.error) : `Background execution ended with status ${durableStatus.status}.`);\n        }\n        const durableText = durableStatus.output?.result?.text || '';\n        accumulatedText = durableText;\n        handleChunkArrival({ text: durableText, finishReason: durableStatus.output?.result?.finishReason || undefined });\n        removePersistedBackgroundJob(targetConvId);\n      } else if (settings.apiKey && settings.apiKey.trim()) {\n'''

          if "// Optional durable server-side execution." not in text:
              text = text.replace(
                  "      // If user configured a direct API Key, run direct client streaming\n      if (settings.apiKey && settings.apiKey.trim()) {\n",
                  durable_branch
              )

          if "if (durableJobAccepted)" not in text:
              text = text.replace(
                  "    } catch (err: any) {\n",
                  "    } catch (err: any) {\n      if (durableJobAccepted) {\n        console.error('Durable background execution failed after acceptance:', err);\n      }\n",
                  1
              )

          app.write_text(text)

          # Add durable background panel to the existing mobile surfaces hub.
          surfaces = Path('src/components/ElaraSurfaces.tsx')
          s = surfaces.read_text()
          if "DurableBackgroundPanel" not in s:
              s = s.replace(
                  "import { GoogleWorkspaceSettingsPanel } from './GoogleWorkspaceSettingsPanel';\n",
                  "import { GoogleWorkspaceSettingsPanel } from './GoogleWorkspaceSettingsPanel';\nimport { DurableBackgroundPanel } from './DurableBackgroundPanel';\n"
              )
              s = s.replace("useState<'artifacts' | 'google' | 'scratchpad' | null>", "useState<'artifacts' | 'google' | 'scratchpad' | 'background' | null>")
              button = '''        <button\n          onClick={() => setSurface('background')}\n          className="inline-flex min-h-10 items-center gap-2 rounded-full border border-zinc-700 bg-zinc-950/95 px-4 text-xs font-semibold text-zinc-200 shadow-2xl shadow-black/30 backdrop-blur-xl hover:border-violet-500/40 hover:text-white"\n          title="Background runtime"\n        >\n          <Bell className="h-4 w-4 text-violet-400" />\n          Background\n        </button>\n'''
              anchor = "        <button\n          onClick={() => setSurface('google')}"
              s = s.replace(anchor, button + anchor)
              surface = "      {surface === 'scratchpad' && <ScratchpadPanel onBack={() => setSurface(null)} />}\n"
              s = s.replace(surface, surface + "      {surface === 'background' && (\n        <div className=\"fixed inset-0 z-30 flex h-[100dvh] w-full flex-col bg-[#09090b] text-zinc-100\">\n          <header className=\"flex min-h-14 items-center gap-3 border-b border-zinc-800 bg-[#0d0d0f]/95 px-3 backdrop-blur-xl\">\n            <button onClick={() => setSurface(null)} className=\"h-9 w-9 rounded-lg text-zinc-400 hover:bg-zinc-800 hover:text-zinc-100\">←</button>\n            <div><div className=\"text-sm font-semibold\">Background runtime</div><div className=\"text-[10px] text-zinc-500\">Continue supported work after the page closes</div></div>\n          </header>\n          <main className=\"min-h-0 flex-1 overflow-y-auto px-3 py-4 sm:px-5\"><DurableBackgroundPanel /></main>\n        </div>\n      )}\n")
          surfaces.write_text(s)
          PY

      - name: Commit application patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/ElaraSurfaces.tsx
          git rm -f .github/workflows/wire-durable-chat.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire chat to durable background runtime"
          git push origin HEAD:${GITHUB_REF_NAME}
